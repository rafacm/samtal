# samtal-server configuration example.
#
# Copy this file somewhere outside the repository (or to a gitignored
# *.local.yaml) and point the server at it:
#
#   SAMTAL_CONFIG=/path/to/config.yaml uv run samtal-server
#   uv run samtal-server --config /path/to/config.yaml
#
# This file holds the server half of the configuration: how the process
# runs (server:) and where remembered facts are kept (memory:). The
# domain half, everything about what the server says and to whom
# (providers, mcp_servers, prompt_fragments, agent_defaults, agents,
# devices, default_agent), lives in the database under
# server.database.dir and is written with the config commands:
#
#   samtal-server config set provider llm claude -f examples/llm-anthropic.yaml
#   samtal-server config set prompt-fragment household -f examples/prompt-fragment.yaml
#   samtal-server config set agent sam -f examples/agent.yaml
#   samtal-server config bind-device aa:bb:cc:dd:ee:ff sam
#   samtal-server config list
#
# Those commands write through the configuration API described under
# server.api below, so they need a running server, and an empty database
# is a valid state to run one on: start the server, configure it, restart
# it. `samtal-server config --local` is the recovery path for a server
# that will not start (show, delete, clear-secret, set-secret).
#
# Every field of it is documented in docs/reference/domain-config.md
# (generated from the models, also available as `samtal-server config
# reference`), and examples/ holds a commented fragment per entity and
# provider type to copy from. A domain section left in this file, or a
# SAMTAL_ override for one, refuses the boot naming where it moved.
#
# Secrets never live in this file: a provider names the environment
# variable that holds its key (api_key_env), and the server reads the
# variable at startup; a credential can also be stored encrypted in the
# database with `samtal-server config set-secret`. Any key here can be
# overridden with a SAMTAL_-prefixed environment variable, nested keys
# joined with __ (SAMTAL_SERVER__PORT=9000,
# SAMTAL_SERVER__LOG_LEVEL=DEBUG); a .env file next to where the server
# is started works too.

server:
  host: 0.0.0.0
  port: 8003
  # The websocket URL the OTA endpoint hands to devices. Commented out here
  # because the default (derive it from the address the device reached the
  # OTA endpoint on) is what a plain LAN deployment wants. Set it when the
  # server sits behind a proxy or a name the request headers do not carry.
  # websocket_url: ws://192.168.1.10:8003/xiaozhi/v1/
  #
  # The origin devices reach this server on, written the way a person
  # types it: scheme, host, optional port, and a path prefix when a
  # proxy serves the server under one. Its only job is the onboarding
  # URL the server prints at startup and on a GET of the OTA endpoint.
  # Left unset, that origin is taken from websocket_url, and failing
  # that guessed from the listen address, which is a guess the line says
  # is one (0.0.0.0 is where the server listens, not somewhere a device
  # can go).
  # public_url: https://voice.example
  #
  # Binary protocol version advertised to devices: 1 is bare Opus frames,
  # 2 and 3 add timestamp headers.
  # protocol_version: 1
  #
  # Where the OTA endpoint is served. It issues the device tokens, so it
  # cannot itself require one; exposing the server publicly, append a
  # long random segment and write that whole URL into the device's NVS:
  #
  #   openssl rand -hex 16
  #
  # Set it to null to unmount this route entirely, which a deployment
  # does once every board it serves has been moved to the short
  # onboarding path below. The websocket path never moves: the token is
  # what protects it.
  # ota_path: /xiaozhi/ota/
  #
  # Minutes east of UTC, sent so the device can set its clock to local time.
  # Defaults to the server's own current offset.
  # timezone_offset_minutes: 120
  #
  # How the server logs. "text" is the human format (the default); "json"
  # is one object per line, which is what the container image defaults to
  # and what a collector groups by session to measure the pipeline. The
  # records carry metadata only; what was said is in the conversation
  # store, under server.conversations below.
  # log_format: text
  # log_level: INFO

  # Device authentication. On by default, and the server refuses to boot
  # when it is on with no secret in the environment, so a deployment
  # never quietly serves every device that connects:
  #
  #   SAMTAL_AUTH_SECRET=$(openssl rand -hex 32)
  #
  # The OTA endpoint issues each bound device a token, the device
  # persists it, and the websocket handshake checks it. Turning this off
  # is the one deliberate flag for a trial on a trusted network.
  auth:
    enabled: true
    # The environment variable holding the secret, never the secret.
    secret_env: SAMTAL_AUTH_SECRET
    # How long an issued token stays valid (30 days). Devices re-check
    # OTA on every boot, so one in normal use is re-issued long before.
    # token_expire_s: 2592000

  # The short onboarding path, /x/<key>/, which serves the same OTA
  # endpoint as ota_path above. Onboarding a board means typing its
  # backend URL into a captive portal on a phone, with nothing on the
  # far side to say a typo happened, so this is the string a person
  # actually types: eight characters, in an alphabet with no 0/O and no
  # 1/I/l to misread off a small display.
  #
  # The key is derived from the device authentication secret this
  # deployment already has, so there is nothing to configure and nothing
  # stored: it is stable across restarts and changes only when that
  # secret does. The server prints the whole URL at startup, and a
  # wrong key answers 404 while logging the attempted key beside the
  # correct one, which is how a typo (and a rotated secret) diagnoses
  # itself. With auth turned off there is no secret, so the route is
  # served keyless at /x/.
  #
  # Two commands read this file and answer without a server: `ota-url`
  # prints the URL to type, and `doctor` says what a device pointed at
  # it would be told.
  #
  #   samtal-server config ota-url
  #   samtal-server config doctor
  #
  # A board typing that URL and resolving to no agent is answered with a
  # six-digit code it shows and speaks; `config pending` lists what is
  # waiting and `config add-device <code> <agent>` binds it, with no
  # restart and no MAC to look up. A deployment with default_agent set
  # covers every unknown board already, so its devices never see a code.
  onboarding:
    enabled: true
    # The key, pinned. Its one use is a secret rotation: pinning the
    # previous key keeps already provisioned boards reaching the URL
    # they were given while the new secret takes over everything else.
    # Eight base32 characters (A-Z and 2-7), and better injected from
    # the environment than written here, since it stands in front of the
    # endpoint that issues device tokens:
    #
    #   SAMTAL_SERVER__ONBOARDING__KEY=AB2C4D5E
    # key: AB2C4D5E

  # The configuration REST API, served under /api on the port above.
  # It is always mounted and always behind a bearer token: there is no
  # enabled flag, because an admin surface switched off by forgetting a
  # key is a surface that ships unprotected. The server refuses to boot
  # when the variable named below holds nothing:
  #
  #   SAMTAL_API_SECRET=$(openssl rand -hex 32)
  #
  # The token grants everything the API can do, secret writes included,
  # so it belongs on a loopback connection or behind TLS and nowhere
  # else.
  api:
    # The environment variable holding the token, never the token.
    secret_env: SAMTAL_API_SECRET

  # Where the domain half of the configuration is stored: one SQLite
  # file named samtal.db inside this directory, written by the server
  # through the configuration API and read once at each server start.
  # The directory is the key, the way memory.dir and capture.dir are,
  # and it must be on the data volume.
  #
  # The default below is the generic one; a container image points this
  # at its own writable volume, and a development machine needs it
  # pointed somewhere writable too:
  #
  #   SAMTAL_SERVER__DATABASE__DIR=./var uv run samtal-server
  #
  # The same variable points `samtal-server config --local` at it, which
  # is the one way a command reads or writes this file with no server on
  # the other side.
  #
  # A write through the config commands applies at the next start: the
  # configuration is a boot-time snapshot, so restart the server after
  # an edit. Two exceptions, and each write says which case it is in: a
  # running server re-reads device bindings as a device asks for them,
  # and `samtal-server config reload` has it re-read the MCP servers and
  # the agents' grant lists without a restart.
  # database:
  #   dir: /var/lib/samtal

  # What one server holds at once, and for how long. A device refused for
  # capacity reconnects on its next wake word; one closed by either time
  # bound does the same, so none of this is visible in normal use.
  limits:
    max_sessions: 8
    max_session_s: 3600
    # How long a realtime session may go without conversing before the
    # server hangs up, counted from the end of the last utterance or the
    # end of the last reply, whichever is later. Arriving audio does not
    # reset it: a realtime device streams its mic continuously, silence
    # included, and nothing in the firmware ever closes that channel, so
    # this is what stops walking away from leaving a mic running for the
    # rest of max_session_s. Realtime only; an auto-mode device re-arms
    # per turn and is bounded by max_session_s as before.
    idle_timeout_s: 120

  # Refuse to boot anything that sends session data off this host.
  # With this on, a provider entry of a cloud type (anthropic) fails at
  # startup with an error naming the stage and provider, an
  # openai_compatible entry is refused unless it declares egress: false,
  # and every referenced MCP server needs the same declaration (both are
  # documented in docs/reference/domain-config.md). Running fully local
  # becomes a checked property of the server rather than a
  # documentation property of a carefully chosen configuration: a
  # local_only server that starts is a local_only server. Off by
  # default.
  # local_only: false

  # RECORDS ROOM AUDIO TO DISK when enabled. Off here, and off by
  # default: nothing below does anything until `enabled` says so.
  # When it is on, every session writes three files, a warning says so
  # at startup, and each recorded session names its file.
  #
  # It exists because acoustic problems cannot be reproduced in any test
  # lane. A recording of the microphone alongside what the speaker was
  # playing is what lets echo leakage be measured rather than guessed,
  # which is what tuning barge-in against a real environment needs.
  #
  # Three files per session: a stereo WAV (channel 0 the microphone,
  # channel 1 the reply, so one sample index is one instant in both), a
  # JSONL decision track whose offsets index into it, and a JSON
  # manifest recording what the capture was made against.
  #
  # The flag is the switch, rather than the presence of this section, so
  # that turning capture off again after a recording does not mean
  # deleting the directory and the budgets along with it.
  capture:
    enabled: false
    # Must be on the data volume: the container root is read-only.
    dir: /data/captures
    # Stop capturing a session after this many seconds. The
    # conversation carries on; only the recording stops.
    max_session_s: 900
    # Total budget for the directory. Whole captures are pruned,
    # oldest first, when it is exceeded. Stereo 16 kHz is 64 kB/s, so
    # 2000 MB is around nine hours.
    max_total_mb: 2000
    # Refuse to start a capture when the volume has less free than
    # this. The budget above does not protect the volume on its own:
    # agent memory and the model caches share it and grow underneath,
    # and capture must not be what fills it.
    min_free_mb: 1000

  # RECORDS WHAT WAS SAID to a database when enabled. Absent here, and
  # off by default: with no section, or with `enabled: false`, nothing is
  # written and no conversations.db is created.
  #
  # When it is on, the server writes conversations.db beside samtal.db in
  # server.database.dir above: sessions, turns, the tool calls a turn
  # made, and the structured events underneath them, as the queryable
  # record of what was said. A warning at startup says so, and names the
  # file. Audio never enters it; the session capture above is the
  # recording, and this is the record.
  #
  # Under the flag, two independent storage switches decide what a row
  # keeps, and every combination is supported. Read it with SQL over a
  # WAL-safe copy, delete from it with `samtal-server conversations
  # purge`, and see docs/reference/conversations-schema.md for the
  # columns.
  # conversations:
  #   enabled: false
  #   # Store the structured events and every measured number (durations,
  #   # token counts, timings). With this off, no events rows land and
  #   # the numeric columns on turns and tool invocations are null.
  #   metrics: true
  #   # Store conversation text, and tool names, arguments and results.
  #   # With this off, rows still land with the content columns null, so
  #   # timing analysis survives the stricter setting.
  #   text: true
  #   # Prune sessions older than this many days, whole sessions at a
  #   # time, at startup and at each session close. 0 keeps everything
  #   # and must be chosen deliberately: a store with no policy retains
  #   # forever.
  #   retention_days: 90

  # Whether speech that arrives while a reply is playing interrupts it.
  # On by default: a device only keeps streaming its microphone through
  # playback when its echo cancellation is on, so what arrives then is
  # the user cutting in. Turn it off for a board whose cancellation
  # leaks the speaker back into the microphone (a single-mic board),
  # where a reply would otherwise interrupt itself. Conversations stay
  # multi-turn either way; only the interrupting goes.
  # barge_in: true

  # The gates in front of a barge-in, applied to an utterance the
  # endpointer ends while a reply is playing. Speech shorter than the
  # floor never interrupts, and neither does anything inside the
  # refractory window after the reply starts speaking; past both, the
  # reply is paused while ASR confirms the interruption, and cancelled
  # only when something was actually said. A reply is only cancelled
  # on evidence of user speech; acoustics alone can at most pause it.
  # barge_in_min_speech_ms: 500
  # barge_in_refractory_ms: 1000

  # How much audio from before the detected start of speech rides along
  # to ASR, so the first phoneme survives the trim. Everything earlier
  # is dropped before transcription: a continuously listening device
  # otherwise carries the whole gap since the previous utterance.
  # utterance_pre_roll_ms: 300

  # How long the LLM may take to produce its first token before the
  # round is cancelled and retried once. A second timeout gives the
  # round up cleanly: the failure is a silent turn, never a session
  # stuck in replying. Only the wait for the first token is bounded;
  # a long reply that is already streaming is healthy and runs as long
  # as it runs, and any sign of the stream delivering counts, so a
  # round that streams nothing but a tool call is not mistaken for a
  # stall. The default is set against field data: healthy first
  # tokens cluster at 500 to 800 ms, the worst spike that still
  # answered was 8.9 s, and the one pathological stall observed sat at
  # 17 s with nothing on the wire. Ten seconds clears every healthy
  # round seen while cutting a stall early enough that the retry
  # (observed answering in about 6 s) speaks around the time the stall
  # would have; a wrongly fired watchdog costs one duplicate request,
  # so the default leans toward rescuing the user sooner.
  # llm_first_token_timeout_s: 10

  # How long a shutdown waits for conversations in flight to finish
  # speaking. Twenty seconds sits inside the thirty an orchestrator
  # commonly allows between SIGTERM and SIGKILL; `docker stop` needs its
  # own -t raised above this, since its default is ten.
  # drain_s: 20

# Facts agents remember between conversations. The whole section is
# optional: without it there is no `remember` tool and nothing is
# injected into any prompt. One file per agent, created on first write,
# read into the system prompt on every reply. Memory is keyed by agent
# and not by device, because an agent is one entity across rooms.
#
# Keyed by agent name means **renaming an agent orphans its memory**.
# The old file stays on disk and the renamed agent starts empty, which
# costs nothing on an agent created this morning and loses everything
# on one that has been accumulating facts for months. Rename the file
# alongside the config, or do not rename the agent.
#
# Agent memory is also not the same thing as what an agent appears to
# know inside one conversation. Conversation history carries across a
# `switch_agent` handover, so an agent that has never stored a fact
# can still greet the user by name the moment it takes over: it is
# reading the transcript, not its own file. The two are easy to
# conflate when a handover looks uncannily well informed.
memory:
  dir: /var/lib/samtal/memory

