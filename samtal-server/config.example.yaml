# samtal-server configuration example.
#
# Copy this file somewhere outside the repository (or to a gitignored
# *.local.yaml) and point the server at it:
#
#   SAMTAL_CONFIG=/path/to/config.yaml uv run samtal-server
#   uv run samtal-server --config /path/to/config.yaml
#
# Secrets never live in this file: a provider references the environment
# variable that holds its key (api_key_env), and the server reads the
# variable at startup. Any key here can be overridden with a
# SAMTAL_-prefixed environment variable, nested keys joined with __
# (SAMTAL_SERVER__PORT=9000, SAMTAL_DEFAULT_AGENT=assistant); a .env file
# next to where the server is started works too.

server:
  host: 0.0.0.0
  port: 8003
  # The websocket URL the OTA endpoint hands to devices. Commented out here
  # because the default (derive it from the address the device reached the
  # OTA endpoint on) is what a plain LAN deployment wants. Set it when the
  # server sits behind a proxy or a name the request headers do not carry.
  # websocket_url: ws://192.168.1.10:8003/xiaozhi/v1/
  #
  # Binary protocol version advertised to devices: 1 is bare Opus frames,
  # 2 and 3 add timestamp headers.
  # protocol_version: 1
  #
  # Minutes east of UTC, sent so the device can set its clock to local time.
  # Defaults to the server's own current offset.
  # timezone_offset_minutes: 120

# Providers are named so agents can reference them. Every entry needs a
# `type`; the remaining keys are options for that provider implementation.
providers:
  llm:
    claude:
      type: anthropic
      model: claude-sonnet-5
      api_key_env: ANTHROPIC_API_KEY
    local:
      type: openai_compatible
      base_url: http://localhost:11434/v1
      model: qwen3:8b
  asr:
    whisper:
      type: faster_whisper
      # Whisper model size (tiny/base/small/medium/large-v3 or a
      # Hugging Face model id); weights download at server startup.
      model: small
      # Language hint (ISO 639-1, e.g. sv or en); omit to auto-detect
      # per utterance.
      # language: sv
      # device: cpu
      # compute_type: int8
      # beam_size: 5
  tts:
    piper:
      # piper-tts is GPL-3.0 and therefore an optional extra:
      #   uv sync --extra piper
      type: piper
      # Voice name from the Piper voice collection
      # (https://huggingface.co/rhasspy/piper-voices), downloaded at
      # server startup.
      voice: sv_SE-nst-medium
      # Where voices are stored (default: ~/.cache/samtal/piper).
      # download_dir: /var/lib/samtal/piper
  vad:
    silero:
      type: silero
      # End-of-utterance tuning, defaults shown: Silero speech
      # probability threshold, the silence that ends an utterance, and
      # the cap on utterance length.
      # threshold: 0.5
      # trailing_silence_ms: 700
      # max_utterance_ms: 10000

# Agents combine a prompt with one provider per stage.
agents:
  assistant:
    prompt: >
      You are a helpful voice assistant. Keep replies short and speakable.
    llm: claude
    asr: whisper
    tts: piper
    vad: silero

# Devices are bound to agents by MAC address (as sent in the Device-Id
# header). Unknown devices get default_agent.
devices:
  "aa:bb:cc:dd:ee:ff": assistant

default_agent: assistant
