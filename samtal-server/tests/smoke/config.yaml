# The configuration the smoke lane's server runs on.
#
# Mock providers throughout, so the smoke conversation needs no model
# downloads, no API keys, and no network: what it proves is that the
# image boots, serves both endpoints, issues a token the websocket
# accepts back, and carries one conversation from audio in to audio out.
# Which engine speaks is the device checkpoint's question, not this
# lane's.

server:
  host: 0.0.0.0
  port: 8003
  # Device authentication stays on, as it is everywhere: the token round
  # trip is part of what this lane checks. The secret comes from
  # SAMTAL_AUTH_SECRET in the container's environment.

providers:
  llm:
    mock:
      type: mock
      reply: "You said {text}."
  asr:
    mock:
      type: mock
      text: hello
  tts:
    mock:
      type: mock
  vad:
    mock:
      type: mock

agent_defaults:
  llm: mock
  asr: mock
  tts: mock
  vad: mock

agents:
  assistant:
    prompt: A smoke test assistant.

default_agent: assistant
