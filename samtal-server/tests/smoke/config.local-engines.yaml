# The server half of the check that the slim image refuses a local
# engine.
#
# Its domain half is seeded by seed-local-engines.sh, which names
# faster_whisper for ASR. The registry raises a ProviderError at boot
# naming the missing extra, which is the same failure an operator gets
# from a bad provider configuration anywhere. The point of checking it
# is that the message says what to do: the alternative, an image that
# starts and then breaks on the first utterance, is much worse than one
# that will not start.

server:
  host: 0.0.0.0
  port: 8003
