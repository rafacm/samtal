[project]
name = "samtal-server"
version = "0.1.0"
description = "Samtal conversation server: OTA endpoint, device websocket protocol, and the VAD/ASR/LLM/TTS pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=18.0.0",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
samtal-server = "samtal_server.main:main"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9",
    "xiaozhi-sdk>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["samtal_server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
