[project]
name = "samtal-server"
version = "0.1.0"
description = "Samtal conversation server: OTA endpoint, device websocket protocol, and the VAD/ASR/LLM/TTS pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.120.0",
    "av>=18.0.0",
    "fastapi>=0.115",
    "openai>=2.48.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pysilero-vad>=3.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
# Local ASR (MIT). Model weights download from Hugging Face at startup.
faster-whisper = ["faster-whisper>=1.2"]
# Local TTS. piper-tts is GPL-3.0, which is why it is an optional extra
# and must never become a core dependency.
piper = ["piper-tts>=1.6"]

[project.scripts]
samtal-server = "samtal_server.main:main"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9",
    "xiaozhi-sdk>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["samtal_server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # opuslib, the codec inside the xiaozhi-sdk test simulator (the server
    # itself uses PyAV), compiles with an `is not 0` identity comparison.
    # Unmaintained upstream, so the warning is not going away.
    "ignore:\"is not\" with 'int' literal:SyntaxWarning",
]
