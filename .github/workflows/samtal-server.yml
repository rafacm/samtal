name: samtal-server

on:
  push:
    branches: [main]
    paths:
      - "samtal-server/**"
      - ".github/workflows/samtal-server.yml"
  pull_request:
    paths:
      - "samtal-server/**"
      - ".github/workflows/samtal-server.yml"

defaults:
  run:
    working-directory: samtal-server

env:
  # Timestamp-validated `.pyc` files can serve a stale module when a
  # source keeps its byte count and its mtime rounds to the same second,
  # which is a real hazard in a working tree and pure overhead on a
  # runner that starts from a fresh checkout every time. tests/conftest.py
  # sets the same flag for pytest; this covers everything that is not
  # pytest. It does not reach the image build, whose sources never change
  # after the build and which keeps `UV_COMPILE_BYTECODE=1` on purpose.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "samtal-server/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Integration tests
        run: uv run pytest tests/integration -v

      # The database's Alembic scripts live inside the package so that a
      # built wheel carries them, and no test run from the checkout can
      # prove that: the source tree makes every file discoverable
      # whether it was packaged or not. So build the artifact, install
      # it on its own, and migrate a fresh database from it with the
      # source tree off sys.path. `-P` drops the current directory from
      # sys.path, and the run happens outside the checkout as well, so
      # `samtal_server` can only resolve to the installed wheel; the
      # script asserts that too rather than trusting it.
      - name: Migrate a fresh database from the built wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$RUNNER_TEMP"/dist/*.whl
          mkdir -p "$RUNNER_TEMP/wheel-run"
          cd "$RUNNER_TEMP/wheel-run"
          "$RUNNER_TEMP/wheel-venv/bin/python" -P - <<'PY'
          import pathlib
          import sys
          import tempfile

          import samtal_server
          from samtal_server.db import open_database
          from sqlalchemy import inspect

          installed = pathlib.Path(samtal_server.__file__).resolve()
          if "site-packages" not in installed.parts:
              sys.exit(f"the source tree was imported, not the wheel: {installed}")

          engine = open_database(pathlib.Path(tempfile.mkdtemp()) / "db")
          tables = set(inspect(engine).get_table_names())
          engine.dispose()

          expected = {
              "providers",
              "mcp_servers",
              "agent_defaults",
              "agents",
              "devices",
              "domain_settings",
          }
          missing = expected - tables
          if missing:
              sys.exit("the wheel's migrations did not create: " + ", ".join(sorted(missing)))
          print(f"migrated a fresh database from {installed.parent}")
          PY

  # The image is built and smoke-tested on every run, and published only
  # on a push to main. `needs: test` is what makes publishing conditional
  # on the suite: nothing reaches the registry that did not pass it.
  #
  # Two variants, from one Dockerfile so they cannot drift. `default`
  # carries the local engines and keeps the unsuffixed tags every
  # existing puller expects; `slim` carries neither and takes `-slim`
  # ones, for a deployment whose ASR and TTS are external providers.
  # Both run the whole smoke conversation, which is what makes them
  # provably the same server rather than two that merely build.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Both variants are reported even when one fails: which of them
      # broke is the first thing worth knowing.
      fail-fast: false
      matrix:
        include:
          # `moving` is the tag that follows main; `suffix` is what
          # marks the dated and sha tags. The default variant's are
          # unsuffixed on purpose, so `latest` keeps meaning what it
          # has always meant.
          - variant: default
            moving: latest
            suffix: ""
          - variant: slim
            moving: slim
            suffix: "-slim"
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/samtal-server
      # Throwaway, and only ever inside this job: the smoke lane needs
      # the signing key to verify the token the server issues it.
      SAMTAL_AUTH_SECRET: smoke-lane-secret-not-a-real-deployment
    steps:
      - uses: actions/checkout@v7

      # The seven characters `docker/metadata-action`'s
      # `type=sha,format=short` puts in the image tag, computed once so
      # every place below agrees with the tag by construction. What a
      # container reports and what its tag says are then the same
      # string, which is what a post-deploy check compares.
      #
      # Deliberately not `git rev-parse --short`, whose length git
      # widens as the object count grows: what this has to agree with
      # is the tag, and the tag is seven characters whatever git would
      # rather abbreviate to.
      - name: The revision this build is
        run: echo "REVISION=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "samtal-server/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: samtal-server
          platforms: linux/amd64
          load: true
          tags: samtal-server:ci-amd64
          # The same arguments the publish step passes, so the whole
          # route from build argument to what the server reports is
          # exercised by the smoke lane on every run, rather than first
          # being exercised by a publish to main.
          build-args: |
            SAMTAL_REVISION=${{ env.REVISION }}
            SAMTAL_VARIANT=${{ matrix.variant }}
          # Scoped per variant. The two carry different dependency
          # layers, and an unscoped gha cache is one namespace, so
          # without this they overwrite each other's manifests every
          # run and each variant pays for the other's churn. Not a
          # correctness risk (BuildKit cache is content addressed), a
          # hit-rate one.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # A wheel with no aarch64 variant is a thing a user should never be
      # the first to find out about, so both architectures are asked to
      # import the extras before anything is published.
      - name: Check the extras import (amd64)
        if: matrix.variant == 'default'
        run: docker run --rm --entrypoint python samtal-server:ci-amd64 -c "import faster_whisper, piper"

      # The slim variant's whole point is their absence, so it is
      # asserted rather than assumed: an extra creeping back in would
      # otherwise show up only as an image that quietly grew.
      - name: Check the extras are absent (amd64)
        if: matrix.variant == 'slim'
        run: |
          for module in faster_whisper piper; do
            if docker run --rm --entrypoint python samtal-server:ci-amd64 \
                -c "import $module" 2>/dev/null; then
              echo "::error::$module is installed in the slim image"
              exit 1
            fi
          done
          # pysilero-vad is a core dependency, not an extra, and runs on
          # every audio frame whichever ASR is configured.
          docker run --rm --entrypoint python samtal-server:ci-amd64 -c "import pysilero_vad"

      - name: Build the arm64 image
        uses: docker/build-push-action@v6
        with:
          context: samtal-server
          platforms: linux/arm64
          load: true
          tags: samtal-server:ci-arm64
          build-args: |
            SAMTAL_REVISION=${{ env.REVISION }}
            SAMTAL_VARIANT=${{ matrix.variant }}
          # Scoped per variant. The two carry different dependency
          # layers, and an unscoped gha cache is one namespace, so
          # without this they overwrite each other's manifests every
          # run and each variant pays for the other's churn. Not a
          # correctness risk (BuildKit cache is content addressed), a
          # hit-rate one.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Check the extras import (arm64, under QEMU)
        if: matrix.variant == 'default'
        run: docker run --rm --platform linux/arm64 --entrypoint python samtal-server:ci-arm64 -c "import faster_whisper, piper"

      # What the slim variant exists for, and what it must refuse. Both
      # against the amd64 image, since this is about which packages are
      # installed rather than about an architecture. The keys are
      # throwaway and nothing here reaches a vendor: the assertion is
      # that the providers are built and the server serves, not that a
      # conversation runs, which the smoke suite below covers.
      - name: Check the slim image boots on external providers
        if: matrix.variant == 'slim'
        run: |
          docker run -d --name slim-boot -p 18003:8003 \
            -e SAMTAL_AUTH_SECRET \
            -e ANTHROPIC_API_KEY=not-a-real-key \
            -e OPENAI_API_KEY=not-a-real-key \
            -v "$PWD/tests/smoke/config.slim.yaml:/config/config.yaml:ro" \
            samtal-server:ci-amd64
          for _ in $(seq 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' slim-boot)
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          docker logs slim-boot
          docker rm -f slim-boot
          [ "$status" = "healthy" ] || { echo "::error::the slim image did not come up on an external-provider config"; exit 1; }

      # The other half, and the more important one: an image that
      # started and then broke on the first utterance would be far worse
      # than one that will not start. The message is asserted, not just
      # the exit code, so a refactor that turns this into a generic
      # crash is caught.
      - name: Check the slim image refuses local engines
        if: matrix.variant == 'slim'
        run: |
          if docker run --rm --name slim-refuse \
              -e SAMTAL_AUTH_SECRET \
              -v "$PWD/tests/smoke/config.local-engines.yaml:/config/config.yaml:ro" \
              samtal-server:ci-amd64 > refusal.log 2>&1; then
            echo "::error::the slim image started on a config naming a local engine"
            cat refusal.log
            exit 1
          fi
          cat refusal.log
          grep -q "needs the faster-whisper extra" refusal.log || {
            echo "::error::the refusal did not name the missing extra"
            exit 1
          }

      # The milestone acceptance, encoded: one mounted YAML, one docker
      # run, one whole conversation.
      - name: Start the container
        run: |
          docker run -d --name samtal-smoke \
            -p 8003:8003 \
            -e SAMTAL_AUTH_SECRET \
            -v "$PWD/tests/smoke/config.yaml:/config/config.yaml:ro" \
            samtal-server:ci-amd64

      - name: Wait for the healthcheck
        run: |
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' samtal-smoke)
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "the container never became healthy"
          docker logs samtal-smoke
          exit 1

      - name: Smoke tests
        env:
          SAMTAL_SMOKE_OTA_URL: http://127.0.0.1:8003/xiaozhi/ota/
          # What the image above was built with, so the smoke lane can
          # check that a container can name its own build. Unset when
          # somebody runs this against a container they started by hand,
          # and the check skips rather than guesses.
          SAMTAL_SMOKE_REVISION: ${{ env.REVISION }}
        run: uv run pytest tests/smoke -v

      # `docker stop` is what sends SIGTERM and waits; -t is above
      # server.drain_s so the drain finishes rather than being killed
      # part-way through. `docker rm -f` would SIGKILL and exercise
      # nothing, which is what this step used to do.
      #
      # Deliberately not `if: always()` and deliberately not masked with
      # `|| true`: this asserts that the shutdown ran, and a cleanup
      # command that cannot fail cannot assert anything.
      - name: Stop the container and check it drained
        run: |
          docker stop -t 30 samtal-smoke
          if ! docker logs samtal-smoke 2>&1 | grep -q "shutting down: draining conversations"; then
            echo "::error::SIGTERM did not reach the server: no drain ran before exit"
            docker logs samtal-smoke
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs samtal-smoke || true

      - name: Remove the container
        if: always()
        run: docker rm -f samtal-smoke || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deliberately not gated on main, unlike the login and the publish
      # below. Computing tags is free, and gating it meant the one step
      # that decides what a variant is called was never exercised until
      # after a merge, which is the worst place to find out an
      # expression was wrong. The PR run prints exactly what would be
      # pushed.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Build times rather than versions, like the changelog's dates:
          # there is no semver yet, and a timestamp plus a SHA says
          # everything a rollback needs. To the minute (UTC), not the
          # day: several merges land on a good day, and a tag a later
          # build can claim is a moving pointer wearing a release's
          # clothes. The moving tag is the only one here that moves:
          # `latest` for the default variant, `slim` for the slim one.
          tags: |
            type=raw,value=${{ matrix.moving }}
            type=raw,value={{date 'YYYY-MM-DD-HHmm'}}${{ matrix.suffix }}
            type=sha,format=short,suffix=${{ matrix.suffix }}

      # The agreement this is all for, checked rather than assumed:
      # `type=sha,format=short` decides the tag's length, and if it ever
      # stopped being the seven characters computed above, a container
      # would go back to reporting something its tag does not say, which
      # is the defect and not a detail. Runs on a PR like the tags
      # themselves do, so a change in either is caught before a merge.
      - name: Check the sha tag carries the revision
        run: |
          tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep ':sha-' || true)
          if [ -z "$tag" ]; then
            echo "no sha- tag was computed"
            exit 1
          fi
          echo "tag: $tag"
          echo "revision: $REVISION"
          case "$tag" in
            *":sha-${REVISION}${{ matrix.suffix }}") ;;
            *)
              echo "the sha- tag does not end in the revision this build reports"
              exit 1
              ;;
          esac

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: samtal-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What makes a running container able to name its own build.
          # The same seven characters the `sha-` tag carries, so
          # /healthz and the image tag are equal rather than one being
          # a prefix of the other.
          build-args: |
            SAMTAL_REVISION=${{ env.REVISION }}
            SAMTAL_VARIANT=${{ matrix.variant }}
          # Scoped per variant. The two carry different dependency
          # layers, and an unscoped gha cache is one namespace, so
          # without this they overwrite each other's manifests every
          # run and each variant pays for the other's churn. Not a
          # correctness risk (BuildKit cache is content addressed), a
          # hit-rate one.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
