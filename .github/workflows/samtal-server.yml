name: samtal-server

on:
  push:
    branches: [main]
    paths:
      - "samtal-server/**"
      - ".github/workflows/samtal-server.yml"
  pull_request:
    paths:
      - "samtal-server/**"
      - ".github/workflows/samtal-server.yml"

defaults:
  run:
    working-directory: samtal-server

env:
  # Timestamp-validated `.pyc` files can serve a stale module when a
  # source keeps its byte count and its mtime rounds to the same second,
  # which is a real hazard in a working tree and pure overhead on a
  # runner that starts from a fresh checkout every time. tests/conftest.py
  # sets the same flag for pytest; this covers everything that is not
  # pytest. It does not reach the image build, whose sources never change
  # after the build and which keeps `UV_COMPILE_BYTECODE=1` on purpose.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "samtal-server/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Integration tests
        run: uv run pytest tests/integration -v

  # The image is built and smoke-tested on every run, and published only
  # on a push to main. `needs: test` is what makes publishing conditional
  # on the suite: nothing reaches the registry that did not pass it.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/samtal-server
      # Throwaway, and only ever inside this job: the smoke lane needs
      # the signing key to verify the token the server issues it.
      SAMTAL_AUTH_SECRET: smoke-lane-secret-not-a-real-deployment
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "samtal-server/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: samtal-server
          platforms: linux/amd64
          load: true
          tags: samtal-server:ci-amd64
          # The same argument the publish step passes, so the whole
          # route from build argument to what the server reports is
          # exercised by the smoke lane on every run, rather than first
          # being exercised by a publish to main.
          build-args: |
            SAMTAL_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A wheel with no aarch64 variant is a thing a user should never be
      # the first to find out about, so both architectures are asked to
      # import the extras before anything is published.
      - name: Check the extras import (amd64)
        run: docker run --rm --entrypoint python samtal-server:ci-amd64 -c "import faster_whisper, piper"

      - name: Build the arm64 image
        uses: docker/build-push-action@v6
        with:
          context: samtal-server
          platforms: linux/arm64
          load: true
          tags: samtal-server:ci-arm64
          build-args: |
            SAMTAL_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the extras import (arm64, under QEMU)
        run: docker run --rm --platform linux/arm64 --entrypoint python samtal-server:ci-arm64 -c "import faster_whisper, piper"

      # The milestone acceptance, encoded: one mounted YAML, one docker
      # run, one whole conversation.
      - name: Start the container
        run: |
          docker run -d --name samtal-smoke \
            -p 8003:8003 \
            -e SAMTAL_AUTH_SECRET \
            -v "$PWD/tests/smoke/config.yaml:/config/config.yaml:ro" \
            samtal-server:ci-amd64

      - name: Wait for the healthcheck
        run: |
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' samtal-smoke)
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "the container never became healthy"
          docker logs samtal-smoke
          exit 1

      - name: Smoke tests
        env:
          SAMTAL_SMOKE_OTA_URL: http://127.0.0.1:8003/xiaozhi/ota/
          # What the image above was built with, so the smoke lane can
          # check that a container can name its own build. Unset when
          # somebody runs this against a container they started by hand,
          # and the check skips rather than guesses.
          SAMTAL_SMOKE_REVISION: ${{ github.sha }}
        run: uv run pytest tests/smoke -v

      # `docker stop` is what sends SIGTERM and waits; -t is above
      # server.drain_s so the drain finishes rather than being killed
      # part-way through. `docker rm -f` would SIGKILL and exercise
      # nothing, which is what this step used to do.
      #
      # Deliberately not `if: always()` and deliberately not masked with
      # `|| true`: this asserts that the shutdown ran, and a cleanup
      # command that cannot fail cannot assert anything.
      - name: Stop the container and check it drained
        run: |
          docker stop -t 30 samtal-smoke
          if ! docker logs samtal-smoke 2>&1 | grep -q "shutting down: draining conversations"; then
            echo "::error::SIGTERM did not reach the server: no drain ran before exit"
            docker logs samtal-smoke
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs samtal-smoke || true

      - name: Remove the container
        if: always()
        run: docker rm -f samtal-smoke || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Build times rather than versions, like the changelog's dates:
          # there is no semver yet, and a timestamp plus a SHA says
          # everything a rollback needs. To the minute (UTC), not the
          # day: several merges land on a good day, and a tag a later
          # build can claim is a moving pointer wearing a release's
          # clothes. `latest` is the only tag here that moves.
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD-HHmm'}}
            type=sha,format=short

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: samtal-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What makes a running container able to name its own build.
          # The same commit the `sha-` tag is computed from, so /healthz
          # and the image tag agree.
          build-args: |
            SAMTAL_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
