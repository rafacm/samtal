name: vinga-server

on:
  push:
    branches: [main]
    # This paths list is mirrored, inverted, by docs.yml's paths-ignore:
    # that workflow runs the command-spellings census on everything this
    # one ignores, so the two lists must move together or a class of
    # change stops being census-covered anywhere.
    paths:
      - "vinga-server/**"
      # The generated domain-configuration reference is committed there
      # and diffed below, so an edit to the committed copy alone has to
      # trigger this workflow too. Without it, hand-editing the file
      # would simply pass.
      - "docs/reference/**"
      # The database both lanes run against, and the provisioning the
      # integration lane executes and asserts against: an edit to either
      # has to run the lanes that use them.
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/vinga-server.yml"
  pull_request:
    paths:
      - "vinga-server/**"
      - "docs/reference/**"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/vinga-server.yml"
  # On-demand full runs against any branch: the image job below skips
  # pull_request events, and a branch that touches the image's own
  # plumbing (its name, its env vars, its volume paths) should be able
  # to prove itself before merging rather than on main afterwards. A
  # dispatch run builds and smokes but never publishes; the publish
  # steps are gated on a push to main.
  workflow_dispatch:

# One live run per branch. A pull request that gets a second push
# before its first run finishes is the ordinary shape of this
# repository's own pipeline: a PR is opened and its milestone checkbox
# is ticked a minute later, so two full runs of everything below start
# on the same branch and only the second one's result is ever read.
# Cancelling the superseded one is the whole of what this buys, and on
# a lockfile-changing PR it buys a little more: the two runs raced to
# save the same new uv cache key, and the loser logged "another job may
# be creating this cache" and skipped. That is the inter-run sibling of
# the intra-run race PR #256 fixed with `save-cache: false` on the
# integration lane, and it goes away when there is no second run.
#
# Never on a push to main, which is why the cancellation is an
# expression rather than a plain `true`. The `image` job publishes to
# the registry on exactly that event, and a merge cancelled part-way
# through by the next merge would leave `latest` pointing at whichever
# build happened to survive. Merges to main run to completion, however
# many of them queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: vinga-server

env:
  # Timestamp-validated `.pyc` files can serve a stale module when a
  # source keeps its byte count and its mtime rounds to the same second,
  # which is a real hazard in a working tree and pure overhead on a
  # runner that starts from a fresh checkout every time. tests/conftest.py
  # sets the same flag for pytest; this covers everything that is not
  # pytest. It does not reach the image build, whose sources never change
  # after the build and which keeps `UV_COMPILE_BYTECODE=1` on purpose.
  PYTHONDONTWRITEBYTECODE: "1"

  # One compute thread per library, because the unit lane now runs four
  # worker processes on a four-core runner and every one of them imports
  # onnxruntime: pysilero-vad is a core dependency, not an extra, so the
  # VAD is present in every worker whichever providers a test builds.
  # These pools size themselves to the machine's core count by default,
  # which means four workers asking for roughly sixteen threads on four
  # cores. That oversubscription is descheduling, and descheduling is
  # exactly what the lane's timing margins cannot absorb (the 20/60/80ms
  # filler windows, the 0.3s connect and idle bounds, the 1.2s drain).
  #
  # Invisible on a development machine, which is why it is set here
  # rather than discovered: fourteen cores absorb the oversubscription
  # and the local runs stay green either way.
  #
  # Three names for the same intent, since the pools that matter read
  # different ones: OpenMP's is what onnxruntime and numpy honor
  # generally, and the other two are named explicitly so a build that
  # reads only its own is covered too.
  OMP_NUM_THREADS: "1"
  ORT_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  # The suite runs as two lanes that start at the same time rather than
  # one that runs everything in a row: the unit tests are by far the
  # longest single item, and the integration tests fit entirely inside
  # them, so the critical path becomes the longer lane instead of the sum
  # of both. Nothing moved between lanes for any reason but duration, and
  # nothing was dropped: every step that ran in the old `test` job runs in
  # one of these two.
  #
  # The first three steps (checkout, setup-uv, `uv sync --frozen`) are
  # duplicated by design. A job is its own runner with its own empty
  # workspace, so each lane has to fetch and install for itself. What
  # makes both installs cheap is the uv cache carried over from earlier
  # runs, not one lane warming the other: the lanes start together, so
  # both restore the same key from the previous run, and on a run where
  # `uv.lock` changed the key is cold and both pay the full install.
  # Only the unit lane saves it (see the integration lane's
  # `save-cache: false`), because two jobs writing the same key on the
  # same run is a race one of them loses.
  #
  # `--durations=25` on both pytest invocations so a lane's log keeps
  # naming its slow tail. Splitting the job hides a regression that a
  # single wall-clock number used to make obvious, and the durations
  # table is what replaces it.
  unit:
    runs-on: ubuntu-latest

    # What the lanes connect with, spelled out because the contract is
    # the point: these five are what a deployment sets too, and a lane
    # that relied on a default would not be running the shape it
    # documents.
    #
    # Four of them name the INSTANCE and the fixtures take them as
    # given, which is how the lanes reach the service container below
    # rather than a loopback default. VINGA_DB_NAME names a DATABASE,
    # and the fixtures make their own per run and per worker, so this
    # value is deliberately overridden by tests/conftest.py and reaches
    # nothing. It is set anyway, and kept: for one milestone the
    # fixtures moved a model default and left this variable to win,
    # which the loader lets it do, and four workers spent a whole CI run
    # writing into this one database. A name here that the lane has to
    # override is what keeps that from being green again.
    env:
      VINGA_DB_HOST: 127.0.0.1
      VINGA_DB_PORT: "5432"
      VINGA_DB_NAME: vinga
      VINGA_DB_USER: vinga
      VINGA_DB_PASSWORD: vinga

    # The database both stores live in. A service container rather than
    # a step that starts one, so the runner's health gate is what the
    # steps below wait on and a lane never races the instance.
    #
    # No init script here: `deploy/postgres-init.sql` provisions the
    # read-only analyst role and is mounted by the compose file, which
    # is a development and an infra artifact. What this lane needs is a
    # role that may create databases (the test fixtures make one per
    # worker), which the image's superuser is.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vinga
          POSTGRES_USER: vinga
          POSTGRES_PASSWORD: vinga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vinga -d vinga"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      # First, because it needs nothing but the checkout: a compose file
      # that does not resolve fails the run before the install below
      # spends its minute. What it holds to is the pair of promises the
      # file makes, which no other lane would notice breaking:
      #
      #   - the profile-less invocation, which is the development loop
      #     and the one the test lanes and a locally-run server depend
      #     on, resolves with no secrets anywhere and starts the
      #     database ALONE;
      #   - the `server` profile refuses rather than defaulting when the
      #     secrets are not there, and resolves when they are.
      #
      # The first is the one at risk. Compose interpolates the whole
      # file whatever profile is selected, so a `${VINGA_API_SECRET:?}`
      # written into the server service would refuse the development
      # loop too, and that is a one-character change away at any time.
      #
      # The `.env` written here is removed however this step ends: the
      # server reads one itself (`find_dotenv(usecwd=True)` walks up
      # from `vinga-server/` and would find this one), so leaving it
      # behind would quietly feed every lane below it.
      - name: The compose file resolves both ways
        working-directory: .
        run: |
          set -eu
          trap 'rm -f .env' EXIT

          services=$(docker compose config --services | sort | tr '\n' ' ')
          [ "$services" = "postgres " ] || {
            echo "::error::the profile-less invocation is no longer the database alone: $services"
            exit 1
          }

          if docker compose --profile server config >/dev/null 2>&1; then
            echo "::error::the server profile resolved with no secrets set; it must refuse"
            exit 1
          fi

          printf 'VINGA_API_SECRET=%s\nVINGA_AUTH_SECRET=%s\n' \
            not-a-real-token not-a-real-secret > .env

          # Full resolution first, and `--services` only after it.
          # `--services` alone is NOT the positive of the assertion
          # above: it enumerates the profile's members without
          # resolving the services, so it exits 0 even with no env
          # file at all (measured). On its own it would keep this arm
          # green while every real invocation refused.
          docker compose --profile server config --quiet

          services=$(docker compose --profile server config --services | sort | tr '\n' ' ')
          [ "$services" = "postgres vinga " ] || {
            echo "::error::the server profile no longer resolves to both services: $services"
            exit 1
          }

      # The production compose file, held to the promise its guards
      # make. It is a separate file from the trial one above and it
      # makes the opposite promise: every required value refuses rather
      # than defaulting, because a deployment that inherited the
      # loopback development password by leaving a line out is the
      # failure this file exists to prevent.
      #
      # Both directions, because one successful `config` proves nothing
      # about a refusal. Each required variable is omitted in turn and
      # the resolution has to fail; then the complete, obviously dummy
      # set has to resolve. A guard deleted by accident would pass the
      # second arm alone.
      #
      # The env file goes in `deploy/`, which is compose's project
      # directory for this file and therefore both the `.env` it
      # interpolates from and the `.env` the service mounts. Removed
      # however this step ends, for the reason the trial check's own
      # trap gives: a stray `.env` in this tree is read by things below
      # it.
      #
      # And every compose invocation runs with the required names taken
      # OFF the process environment, which is not tidiness: compose
      # resolves an interpolation from the process environment first and
      # from the env file only after it, and this job exports
      # VINGA_DB_HOST and its four siblings at job level for the
      # Postgres service the lanes connect to. Without the scrubbing,
      # leaving one of those out of the temporary file leaves it set
      # anyway, its guard never fires, and the negative arm of this
      # check reports a file that refuses nothing. Measured: that is
      # exactly how this step failed on its first CI run, on a body
      # that passed locally where those five are not exported.
      - name: The production compose file refuses and resolves
        working-directory: .
        run: |
          set -eu
          trap 'rm -f deploy/.env' EXIT

          file=deploy/docker-compose.production.yml
          required="VINGA_IMAGE VINGA_AUTH_SECRET VINGA_API_SECRET VINGA_DB_HOST VINGA_DB_PORT VINGA_DB_NAME VINGA_DB_USER VINGA_DB_PASSWORD"

          # Everything required except the one named, so what is being
          # tested is that variable's own guard rather than the first
          # guard in the file.
          write_env() {
            : > deploy/.env
            for name in $required; do
              if [ "$name" = "${1:-}" ]; then continue; fi
              printf '%s=%s\n' "$name" "dummy-not-a-real-value" >> deploy/.env
            done
          }

          # Compose, with the temporary env file as the only place it
          # can read a required value from. The `env -u` list is built
          # from the same `required` above rather than written out a
          # second time, so a variable added to the contract is scrubbed
          # by the same edit that starts guarding it.
          scrubbed() {
            unset_flags=""
            for name in $required; do
              unset_flags="$unset_flags -u $name"
            done
            env $unset_flags "$@"
          }

          for omitted in $required; do
            write_env "$omitted"
            if out=$(scrubbed docker compose -f "$file" config 2>&1); then
              echo "::error::$file resolved with $omitted unset; it must refuse"
              exit 1
            fi
            # And the refusal has to be this variable's, named, so a
            # file that refused for an unrelated reason is not read as
            # this guard firing.
            printf '%s\n' "$out" | grep -q "$omitted" || {
              echo "::error::$file refused without $omitted but did not name it"
              printf '%s\n' "$out"
              exit 1
            }
          done

          write_env
          scrubbed docker compose -f "$file" config --quiet

      # The Kubernetes manifests under deploy/k8s/, held to the schemas
      # of the resources they claim to be. Seconds of work needing no
      # service and no cluster, which is why it sits in this lane: what
      # it catches is the class of mistake nothing else here would, a
      # misspelled field or an apiVersion that has moved. What it
      # cannot catch is whether the manifests agree with this server,
      # which is `tests/unit/test_deploy_manifests.py` in the lane
      # below.
      #
      # A pinned release with its sha256 verified before it runs, the
      # same discipline every other pinned tool here follows. A new
      # version's checksum comes from the `CHECKSUMS` file published
      # beside the release's own assets, at
      # https://github.com/yannh/kubeconform/releases
      #
      # The two Secret templates are fed on stdin rather than named as
      # paths, and that is not a style choice: kubeconform selects
      # files by extension, so a path ending `.example` is found to
      # hold no resource at all and the run exits 0 having checked
      # nothing (measured). Their names have to end that way, because a
      # `.yaml` under deploy/k8s/ rides along on
      # `kubectl apply -f deploy/k8s/` and would install its
      # placeholder credentials.
      #
      # The counts are asserted for the same reason: `Valid: 0` is a
      # green exit code, so this says how many resources it expects to
      # have validated rather than trusting that it validated any.
      - name: The Kubernetes manifests validate
        working-directory: .
        env:
          KUBECONFORM_VERSION: "0.8.0"
          KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${RUNNER_TEMP}/kubeconform.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          kubeconform="$RUNNER_TEMP/kubeconform"

          # `-summary` alongside `-output json` is what puts the counts
          # in the document; on its own `json` reports resources and no
          # totals.
          valid() {
            "$kubeconform" -strict -summary -output json "$@" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["summary"]["valid"])'
          }

          expected=$(find deploy/k8s -maxdepth 1 -name '*.yaml' | wc -l)
          "$kubeconform" -strict -summary deploy/k8s/
          counted=$(valid deploy/k8s/)
          [ "$counted" -eq "$expected" ] || {
            echo "::error::kubeconform validated $counted of the $expected manifests under deploy/k8s/"
            exit 1
          }

          for template in deploy/k8s/secret.yaml.example deploy/k8s/secret-init.example; do
            "$kubeconform" -strict -summary - < "$template"
            counted=$(valid - < "$template")
            [ "$counted" -eq 1 ] || {
              echo "::error::kubeconform found nothing to validate in $template"
              exit 1
            }
          done

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "vinga-server/uv.lock"

      # The contributor tier: the project, the dev group, and through
      # that group the serve extra, so this lane has the whole server.
      # A plain `uv sync` and not a named extra, deliberately: this is
      # exactly what a contributor types, and it is the one door no
      # other lane would notice breaking.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # Strict typing over the typed event package and nothing else.
      # The catalog's whole argument is that its annotations carry the
      # contract, and annotations nothing checks are decoration. The
      # scope is in pyproject.toml; widening it to the rest of the
      # server is a decision of its own.
      - name: Type-check the events package
        run: uv run mypy

      # The lane's tests are distributed across worker processes, which
      # is what took it from its measured 6m31s to a measured 2m25s (run
      # 32610208370, the first run of this change) and put the critical
      # path on the integration lane instead.
      #
      # `--dist loadfile` sends a whole file to one worker rather than
      # scattering its tests. Module-scoped fixtures are then paid once
      # per file by construction, which is what the suite's expensive
      # ones (the eighty-one-driver emit capture) assume; the default
      # distribution would rebuild them once per worker that draws a
      # test out of the same file.
      #
      # `auto` and not `4`: today's runner has 4 cores and the two
      # coincide, and on a larger runner `auto` uses it whole while a
      # literal would leave it idle.
      #
      # If the lane turns intermittently red, the response is graded
      # before it is reverted, because contention on 4 real cores is a
      # headroom problem and the levers that buy headroom come first.
      # Step 0 is the thread-pool capping in this workflow's `env:`
      # block: check it is still in force and still covers whatever new
      # library is competing for cores, since a worker that quietly
      # spawns four compute threads costs more headroom than a worker
      # does. Then `-n 3`, then `-n 2`, and only then remove
      # ` -n auto --dist loadfile` (which is the whole change) and
      # reopen #254.
      - name: Unit tests
        run: uv run pytest tests/unit -v --durations=25 -n auto --dist loadfile

  # The shorter lane: the integration tests, the five generated-document
  # drift checks, and the wheel migration. The checks ride here because
  # they cost seconds and this lane finishes well before the other one.
  integration:
    runs-on: ubuntu-latest

    # What the lanes connect with, spelled out because the contract is
    # the point: these five are what a deployment sets too, and a lane
    # that relied on a default would not be running the shape it
    # documents.
    #
    # Four of them name the INSTANCE and the fixtures take them as
    # given, which is how the lanes reach the service container below
    # rather than a loopback default. VINGA_DB_NAME names a DATABASE,
    # and the fixtures make their own per run and per worker, so this
    # value is deliberately overridden by tests/conftest.py and reaches
    # nothing. It is set anyway, and kept: for one milestone the
    # fixtures moved a model default and left this variable to win,
    # which the loader lets it do, and four workers spent a whole CI run
    # writing into this one database. A name here that the lane has to
    # override is what keeps that from being green again.
    env:
      VINGA_DB_HOST: 127.0.0.1
      VINGA_DB_PORT: "5432"
      VINGA_DB_NAME: vinga
      VINGA_DB_USER: vinga
      VINGA_DB_PASSWORD: vinga

    # The database both stores live in. A service container rather than
    # a step that starts one, so the runner's health gate is what the
    # steps below wait on and a lane never races the instance.
    #
    # No init script here: `deploy/postgres-init.sql` provisions the
    # read-only analyst role and is mounted by the compose file, which
    # is a development and an infra artifact. What this lane needs is a
    # role that may create databases (the test fixtures make one per
    # worker), which the image's superuser is.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vinga
          POSTGRES_USER: vinga
          POSTGRES_PASSWORD: vinga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vinga -d vinga"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "vinga-server/uv.lock"
          # Restore from the shared key, never write it. Both lanes
          # resolve the identical dependency set, so a second save is
          # the same bytes under the same key and only ever a race the
          # loser reports as a failed reserve. The unit lane keeps the
          # save because it is the critical path: whatever it warms is
          # what the next run's slowest job starts from.
          save-cache: false

      # The contributor tier: the project, the dev group, and through
      # that group the serve extra, so this lane has the whole server.
      # A plain `uv sync` and not a named extra, deliberately: this is
      # exactly what a contributor types, and it is the one door no
      # other lane would notice breaking.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Integration tests
        run: uv run pytest tests/integration -v --durations=25

      # The reference is generated from the models, so the committed
      # copy is a cache: it exists to be read on GitHub and in an
      # editor, and it is worth nothing if it can drift from what the
      # models say. Regenerating and diffing is what keeps the two the
      # same document. The diff is printed on failure, which names the
      # field that moved.
      - name: Check the committed domain reference is current
        run: |
          uv run vinga-server config reference > "$RUNNER_TEMP/domain-config.md"
          if ! diff -u ../docs/reference/domain-config.md "$RUNNER_TEMP/domain-config.md"; then
            echo "::error::docs/reference/domain-config.md is stale; regenerate it with: uv run vinga-server config reference > ../docs/reference/domain-config.md"
            exit 1
          fi

      # And the server half's, generated from the same models by the
      # same command with the other half named. It is the page that says
      # what a deployment can configure, so a copy that can drift from
      # the models would document a server this repository does not
      # build.
      - name: Check the committed server reference is current
        run: |
          uv run vinga-server config reference server > "$RUNNER_TEMP/server-config.md"
          if ! diff -u ../docs/reference/server-config.md "$RUNNER_TEMP/server-config.md"; then
            echo "::error::docs/reference/server-config.md is stale; regenerate it with: uv run vinga-server config reference server > ../docs/reference/server-config.md"
            exit 1
          fi

      # And the conversation store's schema reference, generated from
      # the SQLAlchemy metadata under the same rule: the committed copy
      # is a cache of what the tables say, and one that can drift from
      # them is worth nothing.
      - name: Check the committed conversations reference is current
        run: |
          uv run vinga-server conversations schema > "$RUNNER_TEMP/conversations-schema.md"
          if ! diff -u ../docs/reference/conversations-schema.md "$RUNNER_TEMP/conversations-schema.md"; then
            echo "::error::docs/reference/conversations-schema.md is stale; regenerate it with: uv run vinga-server conversations schema > ../docs/reference/conversations-schema.md"
            exit 1
          fi

      # And the event schema reference, generated from the registry that
      # declares every event. This one is the whole no-leak contract's
      # documentation: which fields an event may carry, which tokens a
      # reason field admits, what bounds a descriptor is held to. A copy
      # that can drift from the declarations would document a surface
      # this server does not have.
      - name: Check the committed event reference is current
        run: |
          uv run vinga-server events reference > "$RUNNER_TEMP/events.md"
          if ! diff -u ../docs/reference/events.md "$RUNNER_TEMP/events.md"; then
            echo "::error::docs/reference/events.md is stale; regenerate it with: uv run vinga-server events reference > ../docs/reference/events.md"
            exit 1
          fi

      # The same for the configuration API's OpenAPI document, which is
      # generated from the routes and committed for the same reason: it
      # is the machine-readable contract, and a copy that can drift from
      # the routes is worth nothing.
      - name: Check the committed OpenAPI document is current
        run: |
          uv run vinga-server config openapi > "$RUNNER_TEMP/api-openapi.json"
          if ! diff -u ../docs/reference/api-openapi.json "$RUNNER_TEMP/api-openapi.json"; then
            echo "::error::docs/reference/api-openapi.json is stale; regenerate it with: uv run vinga-server config openapi > ../docs/reference/api-openapi.json"
            exit 1
          fi

      # And the CLI reference, which is the one committed document that
      # is only half generated: the prose above the marker is written by
      # hand (installing the thing, reaching a server, rebuilding one)
      # and everything between the markers comes from the command
      # tree and the example fragments. So this rebuilds the page rather
      # than diffing a fragment of it: keep everything up to and
      # including the opening marker, regenerate the region, close it,
      # and diff the whole file. A hand-edited region is reverted by the
      # next run exactly as it is for the four documents above, and a
      # hand-edited head is nobody's to revert.
      - name: Check the committed CLI reference is current
        run: |
          awk '1;/^<!-- generated: cli reference -->$/{exit}' ../docs/reference/cli.md > "$RUNNER_TEMP/cli.md"
          echo >> "$RUNNER_TEMP/cli.md"
          uv run vinga-server config cli-reference >> "$RUNNER_TEMP/cli.md"
          echo '<!-- end generated: cli reference -->' >> "$RUNNER_TEMP/cli.md"
          if ! diff -u ../docs/reference/cli.md "$RUNNER_TEMP/cli.md"; then
            echo "::error::docs/reference/cli.md is stale; regenerate the region between its markers with: uv run vinga-server config cli-reference"
            exit 1
          fi

      # And the recipes inside that region, against the renderer that
      # reads the example fragments rather than against the one that
      # builds the page.
      #
      # Not the step above with a smaller mouth. That one regenerates
      # the whole region through the page composer, so a composer that
      # dropped, truncated or reordered the recipes would move the
      # committed bytes and the fresh render together and pass green.
      # This one reads the committed bytes and compares them against the
      # recipe renderer directly, which is the only reader that can tell
      # those two apart.
      - name: Check the committed CLI recipes are current
        run: |
          uv run python -c 'import sys; from vinga_server.config import cli; sys.stdout.write(cli.cli_recipes())' > "$RUNNER_TEMP/cli-recipes.md"
          awk '/^<!-- end generated: cli recipes -->$/{f=0} f{print} /^<!-- generated: cli recipes -->$/{f=1}' ../docs/reference/cli.md > "$RUNNER_TEMP/committed-recipes.md"
          if [ ! -s "$RUNNER_TEMP/committed-recipes.md" ]; then
            echo "::error::the recipe markers are not on docs/reference/cli.md, so nothing was compared"
            exit 1
          fi
          if ! diff -u "$RUNNER_TEMP/committed-recipes.md" "$RUNNER_TEMP/cli-recipes.md"; then
            echo "::error::the recipes on docs/reference/cli.md are stale; they are read out of the example fragments, so regenerate the page with: uv run vinga-server config cli-reference"
            exit 1
          fi

      # The databases' Alembic scripts live inside the package so that a
      # built wheel carries them, and no test run from the checkout can
      # prove that: the source tree makes every file discoverable
      # whether it was packaged or not. So build the artifact, install
      # it on its own, and migrate a fresh database from it with the
      # source tree off sys.path. `-P` drops the current directory from
      # sys.path, and the run happens outside the checkout as well, so
      # `vinga_server` can only resolve to the installed wheel; the
      # script asserts that too rather than trusting it.
      #
      # Every chain, because they are packaged separately: a wheel that
      # shipped the domain migrations and omitted the conversations ones
      # would pass the first third of this and fail on a deployment at
      # the moment recording is turned on, and one that omitted the
      # memory migrations would fail it at the first boot.
      - name: Migrate a fresh database from the built wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-venv"
          # `[serve]` explicitly, and it is the assertion this step
          # rests on: the wheel's default install is the configuration
          # client, which carries neither SQLAlchemy nor Alembic nor a
          # database driver, so a bare install could not open a database
          # at all. The lane that installs bare on purpose is the tier
          # closure, which asserts the opposite of this and would
          # otherwise be testing the same configuration under a
          # different name.
          #
          # `psycopg[binary]` beside it, which is the other half of the
          # packaging decision this step exists to check: `[serve]`
          # carries the plain source distribution, so an install of the
          # extra alone needs a libpq on the system. The runner has no
          # guarantee of one, and the image installs the binary wheel
          # for exactly this reason, so the step does what the image
          # does.
          #
          # `[sim]` is not named here and has nothing to do with this
          # step: it carries a websocket client and no migration. The
          # tier closure lane is where that extra gets an environment of
          # its own.
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" \
            "$(echo "$RUNNER_TEMP"/dist/*.whl)[serve]" "psycopg[binary]"
          # A database of this step's own, so the wheel migrates
          # something truly blank rather than whatever the lanes left in
          # the service's default database.
          PGPASSWORD="$VINGA_DB_PASSWORD" psql \
            -h "$VINGA_DB_HOST" -p "$VINGA_DB_PORT" -U "$VINGA_DB_USER" \
            -d "$VINGA_DB_NAME" -v ON_ERROR_STOP=1 \
            -c 'drop database if exists vinga_wheel' \
            -c 'create database vinga_wheel'
          mkdir -p "$RUNNER_TEMP/wheel-run"
          cd "$RUNNER_TEMP/wheel-run"
          VINGA_DB_NAME=vinga_wheel "$RUNNER_TEMP/wheel-venv/bin/python" -P - <<'PY'
          import pathlib
          import sys

          import vinga_server
          from vinga_server.config.models import DatabaseConfig
          from vinga_server.conversations.store import CONVERSATIONS_CHAIN, open_conversations
          from vinga_server.db import DOMAIN_CHAIN, open_database, read_engine
          from vinga_server.memory.store import MEMORY_CHAIN, open_memory
          from sqlalchemy import inspect, text

          installed = pathlib.Path(vinga_server.__file__).resolve()
          if "site-packages" not in installed.parts:
              sys.exit(f"the source tree was imported, not the wheel: {installed}")

          # The discrete settings are read from the environment by the
          # loader, which this script does not use, so they are named
          # here: the point is the migration, not the settings path.
          import os

          settings = DatabaseConfig(
              host=os.environ["VINGA_DB_HOST"],
              port=int(os.environ["VINGA_DB_PORT"]),
              name=os.environ["VINGA_DB_NAME"],
              user=os.environ["VINGA_DB_USER"],
          )

          engine = open_database(settings)
          domain = DOMAIN_CHAIN.schema
          inspector = inspect(engine)
          tables = set(inspector.get_table_names(schema=domain))
          columns = {
              table: {column["name"] for column in inspector.get_columns(table, schema=domain)}
              for table in tables
          }
          with engine.connect() as connection:
              domain_revisions = {
                  row[0]
                  for row in connection.execute(
                      text(f"select * from {domain}.alembic_version")
                  )
              }
          engine.dispose()

          expected = {
              "providers",
              "mcp_servers",
              "prompt_fragments",
              "agent_defaults",
              "agents",
              "devices",
              "domain_settings",
          }
          missing = expected - tables
          if missing:
              sys.exit("the wheel's migrations did not create: " + ", ".join(sorted(missing)))
          # The body column on each entity table, which since #243 is
          # where every non-key field of that entity lives. A wheel whose
          # migration built the pre-reshape shape would pass the table
          # check above and fail at the first read on a deployment.
          #
          # The body column only, and deliberately less than the suite
          # asks: this step is about packaging, so what it has to catch
          # is a wheel carrying the wrong chain. The shape itself is
          # checked properly in the suite, where `test_db_open.py` holds
          # each entity table's full column set in EXPECTED_COLUMNS and
          # `test_the_baseline_builds_exactly_what_the_tables_declare`
          # compares the migrated database against the metadata whole.
          bodies = {
              "providers",
              "mcp_servers",
              "prompt_fragments",
              "agent_defaults",
              "agents",
          }
          for table in sorted(bodies):
              if "body" not in columns[table]:
                  sys.exit(f"the wheel's migrations gave {table} no body column")
          # And the head of the packaged domain chain, which is one
          # revision: the chain was re-baselined against Postgres, and a
          # wheel carrying anything else is one whose databases this
          # commit's code cannot read. A new migration moves this line,
          # deliberately, exactly as the other two chains' heads below.
          if domain_revisions != {"3002_drop_max_tokens_secrets"}:
              sys.exit(f"the wheel's domain chain is at {sorted(domain_revisions)}, not ['3002_drop_max_tokens_secrets']")
          print(f"migrated a fresh database from {installed.parent}")

          # The conversation store, from the same installed artifact and
          # into the same database: one database, two schemas, which is
          # the arrangement a deployment has.
          store = open_conversations(settings)
          store_schema = CONVERSATIONS_CHAIN.schema
          with store.connect() as connection:
              revisions = {
                  row[0]
                  for row in connection.execute(
                      text(f"select * from {store_schema}.alembic_version")
                  )
              }
              # The cursor tables, whose ids are handed out as pagination
              # cursors. A sequence never hands out a value twice, which
              # is the property retention needs because it deletes from
              # exactly the end a cursor points past, so this is asserted
              # on what the database was told rather than on the
              # metadata that asked for it.
              identity = {
                  row[0]: row[1]
                  for row in connection.execute(
                      text(
                          "select table_name, is_identity from information_schema.columns "
                          "where table_schema = :schema and column_name = 'id'"
                      ),
                      {"schema": store_schema},
                  )
              }
          store_tables = set(inspect(store).get_table_names(schema=store_schema))
          store.dispose()

          # The head of the packaged chain. A new migration moves this
          # line, deliberately: a wheel that carried an older chain than
          # the one this commit expects is exactly what the check is for.
          if revisions != {"1003_rename_moves_ownership"}:
              sys.exit(f"the wheel's conversations chain is at {sorted(revisions)}, not ['1003_rename_moves_ownership']")
          expected = {
              "sessions",
              "conversations",
              "turns",
              "tool_invocations",
              "conversation_milestones",
              "events",
          }
          missing = expected - store_tables
          if missing:
              sys.exit("the wheel's conversations migrations did not create: " + ", ".join(sorted(missing)))
          for name in ("sessions", "turns", "events"):
              if identity.get(name) != "YES":
                  sys.exit(f"the wheel's {name} table would reuse deleted row ids")
          print(f"migrated a fresh conversation store from {installed.parent}")

          # Agent memory, the third chain, from the same installed
          # artifact and into the same database: one database, three
          # schemas, which is the arrangement a deployment has. The
          # store's opener migrates and is closed again; the inspection
          # goes through `db.read_engine`, which is what reading a
          # database somebody else has migrated is for.
          open_memory(settings).close()
          memory_schema = MEMORY_CHAIN.schema
          reader = read_engine(settings)
          with reader.connect() as connection:
              memory_revisions = {
                  row[0]
                  for row in connection.execute(
                      text(f"select * from {memory_schema}.alembic_version")
                  )
              }
              # The row id is an identity column for the reason the
              # cursor tables above are: a sequence never hands out a
              # value twice, which is what the fact identity update,
              # forget and restore address a row by leans on.
              memory_identity = {
                  row[0]: row[1]
                  for row in connection.execute(
                      text(
                          "select table_name, is_identity from information_schema.columns "
                          "where table_schema = :schema and column_name = 'id'"
                      ),
                      {"schema": memory_schema},
                  )
              }
          memory_tables = set(inspect(reader).get_table_names(schema=memory_schema))
          memory_columns = {
              name: {column["name"] for column in inspect(reader).get_columns(name, schema=memory_schema)}
              for name in sorted(memory_tables)
          }
          reader.dispose()

          # The head of the packaged chain. A new migration moves this
          # line, deliberately, exactly as the two above.
          if memory_revisions != {"2003_rename_moves_memory"}:
              sys.exit(f"the wheel's memory chain is at {sorted(memory_revisions)}, not ['2003_rename_moves_memory']")
          expected = {"facts", "state"}
          missing = expected - memory_tables
          if missing:
              sys.exit("the wheel's memory migrations did not create: " + ", ".join(sorted(missing)))
          if memory_identity.get("facts") != "YES":
              sys.exit("the wheel's facts table would reuse deleted row ids")
          # The scoped shape, from the wheel's own migrations: the
          # renamed column, the held pair, and the ledger's key.
          expected_columns = {"id", "scope", "owner", "at", "fact", "forgotten_at", "forgotten_in"}
          if memory_columns["facts"] != expected_columns:
              sys.exit(f"the wheel's facts table is {sorted(memory_columns['facts'])}, not {sorted(expected_columns)}")
          if memory_columns["state"] != {"conversation", "key", "value", "updated_at"}:
              sys.exit(f"the wheel's state table is {sorted(memory_columns['state'])}, not the conversation ledger")
          print(f"migrated a fresh memory store from {installed.parent}")
          PY

      # And the OpenAPI document, from the same installed artifact and
      # for the same reason. Since #242 the document's own prose lives
      # in data files under the package rather than in string literals,
      # so the drift check above no longer proves what a deployment
      # renders: a checkout makes every file readable whether it was
      # packaged or not, and a wheel that carried the code without the
      # prose would pass it and then refuse at import on a deployment.
      # This renders the document from the wheel with the source tree
      # off sys.path and diffs it against the committed copy, which is
      # the only proof a checkout run cannot fake. It reuses the venv
      # the step above built, so the wheel is built and installed once.
      - name: Render the OpenAPI document from the built wheel
        run: |
          cd "$RUNNER_TEMP/wheel-run"
          "$RUNNER_TEMP/wheel-venv/bin/python" -P - > "$RUNNER_TEMP/wheel-openapi.json" <<'PY'
          import pathlib
          import sys

          import vinga_server
          from vinga_server.config import docgen

          installed = pathlib.Path(vinga_server.__file__).resolve()
          if "site-packages" not in installed.parts:
              sys.exit(f"the source tree was imported, not the wheel: {installed}")
          sys.stdout.write(docgen.openapi())
          print(f"rendered the OpenAPI document from {installed.parent}", file=sys.stderr)
          PY
          cd "$GITHUB_WORKSPACE/vinga-server"
          if ! diff -u ../docs/reference/api-openapi.json "$RUNNER_TEMP/wheel-openapi.json"; then
            echo "::error::the built wheel renders a different OpenAPI document than the committed one; the likely cause is a description file under src/vinga_server/config/api_descriptions/ that the wheel did not carry"
            exit 1
          fi

      # And the CLI reference, from the same installed artifact, for a
      # reason of its own: its recipes are read out of the example
      # fragments, which are a directory beside `src/` that the build
      # copies into the package. A wheel without them would render a
      # reference with no recipes in it, or refuse outright, and either
      # way an operator who installed the CLI as a tool would meet it
      # first. Rendered outside the checkout with `-P`, so the tree the
      # wheel was built from cannot stand in for what it shipped.
      - name: Render the CLI reference from the built wheel
        run: |
          cd "$RUNNER_TEMP/wheel-run"
          "$RUNNER_TEMP/wheel-venv/bin/python" -P - > "$RUNNER_TEMP/wheel-cli-reference.md" <<'PY'
          import pathlib
          import sys

          import vinga_server
          from vinga_server.config import cli, docgen

          installed = pathlib.Path(vinga_server.__file__).resolve()
          if "site-packages" not in installed.parts:
              sys.exit(f"the source tree was imported, not the wheel: {installed}")
          examples = pathlib.Path(str(docgen.EXAMPLE_DIR)).resolve()
          if not examples.is_relative_to(installed.parent):
              sys.exit(f"the recipes were read from outside the wheel: {examples}")
          sys.stdout.write(cli.cli_reference())
          print(f"rendered the CLI reference from {installed.parent}", file=sys.stderr)
          PY
          cd "$GITHUB_WORKSPACE/vinga-server"
          awk '1;/^<!-- generated: cli reference -->$/{exit}' ../docs/reference/cli.md > "$RUNNER_TEMP/wheel-cli.md"
          echo >> "$RUNNER_TEMP/wheel-cli.md"
          cat "$RUNNER_TEMP/wheel-cli-reference.md" >> "$RUNNER_TEMP/wheel-cli.md"
          echo '<!-- end generated: cli reference -->' >> "$RUNNER_TEMP/wheel-cli.md"
          if ! diff -u ../docs/reference/cli.md "$RUNNER_TEMP/wheel-cli.md"; then
            echo "::error::the built wheel renders a different CLI reference than the committed one; the likely cause is the example fragments under vinga-server/examples/ not being carried into the wheel"
            exit 1
          fi

  # The image is built and smoke-tested on every push to main and on
  # every manual dispatch, and published only on a push to main.
  # `needs: [unit, integration]` is what makes publishing conditional on
  # the suite: nothing reaches the registry that did not pass it. Both
  # lanes are named, and both have to be, since between them they hold
  # every check the suite is made of; naming one would publish on half a
  # green suite.
  #
  # Skipped on pull requests, deliberately and temporarily: while the
  # pre-release simplification milestones and the rename land, PRs come
  # quickly and this job (two variants, arm64 under QEMU, the whole
  # smoke conversation) is the longest pole in each round-trip. Every
  # merge still gets the full lane on main, so no merged commit goes
  # unsmoked; a PR that touches the image's own plumbing gets a manual
  # workflow_dispatch run before merging. When the churn settles,
  # delete this job's `if` so PRs run the full lane again.
  #
  # Two variants, from one Dockerfile so they cannot drift. `default`
  # carries the local engines and keeps the unsuffixed tags every
  # existing puller expects; `slim` carries neither and takes `-slim`
  # ones, for a deployment whose ASR and TTS are external providers.
  # Both run the whole smoke conversation, which is what makes them
  # provably the same server rather than two that merely build.
  image:
    needs: [unit, integration]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Both variants are reported even when one fails: which of them
      # broke is the first thing worth knowing.
      fail-fast: false
      matrix:
        include:
          # `moving` is the tag that follows main; `suffix` is what
          # marks the dated and sha tags. The default variant's are
          # unsuffixed on purpose, so `latest` keeps meaning what it
          # has always meant.
          - variant: default
            moving: latest
            suffix: ""
          - variant: slim
            moving: slim
            suffix: "-slim"
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/vinga-server
      # Throwaway, and only ever inside this job: the smoke lane needs
      # the signing key to verify the token the server issues it.
      VINGA_AUTH_SECRET: smoke-lane-secret-not-a-real-deployment
      # Also throwaway, and mandatory from the commit that mounts the
      # configuration API: a server started without it refuses to boot,
      # so every container below that starts a server is given it.
      VINGA_API_SECRET: smoke-lane-api-token-not-a-real-deployment
      # The database every container below is pointed at. A container of
      # its own on a named Docker network rather than a service
      # container, because these servers run under `docker run` and a
      # runner-localhost service is not reachable as localhost from
      # inside one. The host name is the container's name on that
      # network, which is what `--network` gives for free.
      VINGA_DB_HOST: vinga-postgres
      VINGA_DB_PORT: "5432"
      VINGA_DB_USER: vinga
      VINGA_DB_PASSWORD: smoke-lane-db-password-not-a-real-deployment
      # One database per scenario, so the three of them never see each
      # other's rows: the boots-on-external check, the refusal check and
      # the seeded smoke server all start their own servers against the
      # same instance.
      SMOKE_NETWORK: vinga-smoke-net
    steps:
      - uses: actions/checkout@v7

      # The seven characters `docker/metadata-action`'s
      # `type=sha,format=short` puts in the image tag, computed once so
      # every place below agrees with the tag by construction. What a
      # container reports and what its tag says are then the same
      # string, which is what a post-deploy check compares.
      #
      # Deliberately not `git rev-parse --short`, whose length git
      # widens as the object count grows: what this has to agree with
      # is the tag, and the tag is seven characters whatever git would
      # rather abbreviate to.
      - name: The revision this build is
        run: echo "REVISION=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      # The database the containers below talk to, on a network they
      # join. Health-gated before anything is provisioned, so a step
      # never races the instance.
      - name: Start the database the smoke containers share
        run: |
          docker network create "$SMOKE_NETWORK"
          docker run -d --name "$VINGA_DB_HOST" \
            --network "$SMOKE_NETWORK" \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_USER="$VINGA_DB_USER" \
            -e POSTGRES_PASSWORD="$VINGA_DB_PASSWORD" \
            --health-cmd "pg_isready -U $VINGA_DB_USER -d postgres" \
            --health-interval 2s --health-timeout 3s --health-retries 30 \
            postgres:17-alpine
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$VINGA_DB_HOST")
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          [ "$status" = "healthy" ] || {
            echo "::error::the smoke lane's database never became healthy"
            docker logs "$VINGA_DB_HOST"
            exit 1
          }

      # Postgres initializes only the database it was configured with,
      # and the server migrates schemas rather than databases, so each
      # scenario's database is created here before its container runs.
      # Owned by the server role, which is also the superuser here: the
      # role a deployment gives the server needs no CREATEDB, and this
      # step is the development-and-test maintenance connection that
      # does.
      - name: Provision the scenario databases
        run: |
          for name in vinga_slim_boot vinga_slim_refuse vinga_smoke; do
            docker run --rm --network "$SMOKE_NETWORK" \
              -e PGPASSWORD="$VINGA_DB_PASSWORD" \
              postgres:17-alpine \
              psql -h "$VINGA_DB_HOST" -U "$VINGA_DB_USER" -d postgres \
                -v ON_ERROR_STOP=1 \
                -c "create database $name owner $VINGA_DB_USER"
          done

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "vinga-server/uv.lock"

      # The contributor tier: the project, the dev group, and through
      # that group the serve extra, so this lane has the whole server.
      # A plain `uv sync` and not a named extra, deliberately: this is
      # exactly what a contributor types, and it is the one door no
      # other lane would notice breaking.
      - name: Install dependencies
        run: uv sync --frozen

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the amd64 image
        uses: docker/build-push-action@v7
        with:
          context: vinga-server
          platforms: linux/amd64
          load: true
          tags: vinga-server:ci-amd64
          # The same arguments the publish step passes, so the whole
          # route from build argument to what the server reports is
          # exercised by the smoke lane on every run, rather than first
          # being exercised by a publish to main.
          build-args: |
            VINGA_REVISION=${{ env.REVISION }}
            VINGA_VARIANT=${{ matrix.variant }}
          # Scoped per variant. The two carry different dependency
          # layers, and an unscoped gha cache is one namespace, so
          # without this they overwrite each other's manifests every
          # run and each variant pays for the other's churn. Not a
          # correctness risk (BuildKit cache is content addressed), a
          # hit-rate one.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # The marker the image sets for itself, asked of the image rather
      # than assumed from the Dockerfile. Everything else that reads it
      # plants it first, as a test of the check has to, so deleting the
      # `ENV` line leaves the whole suite green and takes the warning
      # about a provider naming localhost inside a container with it
      # (#340). A container built from this Dockerfile is the only thing
      # that can tell, which is what this step is.
      #
      # Asked through the server's own resolver rather than with
      # `printenv`, so what is checked is the answer a provider build
      # asks for. Both variants, since the `ENV` is in the stage they
      # share and both are published; amd64 alone, since an environment
      # variable does not vary by architecture the way a wheel does.
      - name: Check the image says it is a container
        run: |
          if ! docker run --rm --entrypoint python vinga-server:ci-amd64 -c \
              "from vinga_server.build_info import in_container; raise SystemExit(0 if in_container() else 1)"; then
            echo "::error::the ${{ matrix.variant }} image does not report itself as a container; VINGA_CONTAINER is missing from its ENV, and a provider entry naming localhost would build in it without a word"
            exit 1
          fi

      # A wheel with no aarch64 variant is a thing a user should never be
      # the first to find out about, so both architectures are asked to
      # import the extras before anything is published.
      - name: Check the extras import (amd64)
        if: matrix.variant == 'default'
        run: docker run --rm --entrypoint python vinga-server:ci-amd64 -c "import faster_whisper, piper"

      # The quick start, run against the image this job just built. The
      # unit lane already holds the compose file to resolving, which is
      # a syntax check; this is the behavior one, and it is the only
      # place anything proves that the committed file still boots the
      # artifact its default tag names. `VINGA_IMAGE` is what the file
      # exposes for exactly this.
      #
      # The default variant only: the file is variant-agnostic, and the
      # image it defaults to is `latest`, which is the default variant.
      #
      # Deliberately before the arm64 build and everything after it,
      # because this publishes 8003 and the seeded smoke container
      # below publishes the same port. The teardown is a trap rather
      # than a later step for the same reason: nothing after this may
      # inherit a port or a volume from it.
      - name: Check the compose file boots the built image
        if: matrix.variant == 'default'
        working-directory: .
        env:
          VINGA_IMAGE: vinga-server:ci-amd64
        run: |
          set -eu
          trap 'docker compose -p compose-smoke --profile server logs vinga || true
                docker compose -p compose-smoke --profile server down -v || true
                rm -f .env' EXIT

          printf 'VINGA_API_SECRET=%s\nVINGA_AUTH_SECRET=%s\n' \
            "$VINGA_API_SECRET" "$VINGA_AUTH_SECRET" > .env

          docker compose -p compose-smoke --profile server up -d --wait

          # `--wait` returned, so both healthchecks passed: the
          # database's, and the image's own against /healthz. What is
          # asserted here is that the server answering is the build
          # above rather than a `latest` pulled from the registry.
          revision=$(curl -fsS http://127.0.0.1:8003/healthz \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['revision'])")
          [ "$revision" = "$REVISION" ] || {
            echo "::error::the compose stack served revision $revision, expected $REVISION"
            exit 1
          }

      # The slim variant's whole point is their absence, so it is
      # asserted rather than assumed: an extra creeping back in would
      # otherwise show up only as an image that quietly grew.
      - name: Check the extras are absent (amd64)
        if: matrix.variant == 'slim'
        run: |
          for module in faster_whisper piper; do
            if docker run --rm --entrypoint python vinga-server:ci-amd64 \
                -c "import $module" 2>/dev/null; then
              echo "::error::$module is installed in the slim image"
              exit 1
            fi
          done
          # pysilero-vad is a core dependency, not an extra, and runs on
          # every audio frame whichever ASR is configured.
          docker run --rm --entrypoint python vinga-server:ci-amd64 -c "import pysilero_vad"

      - name: Build the arm64 image
        uses: docker/build-push-action@v7
        with:
          context: vinga-server
          platforms: linux/arm64
          load: true
          tags: vinga-server:ci-arm64
          build-args: |
            VINGA_REVISION=${{ env.REVISION }}
            VINGA_VARIANT=${{ matrix.variant }}
          # Scoped per variant. The two carry different dependency
          # layers, and an unscoped gha cache is one namespace, so
          # without this they overwrite each other's manifests every
          # run and each variant pays for the other's churn. Not a
          # correctness risk (BuildKit cache is content addressed), a
          # hit-rate one.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Check the extras import (arm64, under QEMU)
        if: matrix.variant == 'default'
        run: docker run --rm --platform linux/arm64 --entrypoint python vinga-server:ci-arm64 -c "import faster_whisper, piper"

      # What the slim variant exists for, and what it must refuse. Both
      # against the amd64 image, since this is about which packages are
      # installed rather than about an architecture. The keys are
      # throwaway and nothing here reaches a vendor: the assertion is
      # that the providers are built and the server serves, not that a
      # conversation runs, which the smoke suite below covers.
      #
      # The domain half of each check's configuration is written into
      # the scenario's own database first, by running the CLI from the
      # image itself, so the seeding exercises the shipped artifact and
      # the server finds what a deployment's server would find. The
      # mounted YAML is the server half only, and no longer says
      # anything about where the state is: that is the VINGA_DB_*
      # family, passed to every container below.
      #
      # Seeding starts a server of its own inside the seeding container,
      # because the CLI writes through the configuration API, so those
      # containers get the two secrets a server needs. They need no
      # provider credential: with an empty domain half there is no
      # provider to build, which is what makes the first start on an
      # empty database a valid one.
      - name: Check the slim image boots on external providers
        if: matrix.variant == 'slim'
        run: |
          docker run --rm --network "$SMOKE_NETWORK" \
            -e VINGA_AUTH_SECRET \
            -e VINGA_API_SECRET \
            -e VINGA_DB_HOST -e VINGA_DB_PORT -e VINGA_DB_USER -e VINGA_DB_PASSWORD \
            -e VINGA_DB_NAME=vinga_slim_boot \
            -v slim-boot-data:/data \
            -v "$PWD/tests/smoke:/smoke:ro" \
            -v "$PWD/tests/smoke/config.slim.yaml:/config/config.yaml:ro" \
            --entrypoint sh vinga-server:ci-amd64 /smoke/seed-slim.sh
          docker run -d --name slim-boot -p 18003:8003 \
            --network "$SMOKE_NETWORK" \
            -e VINGA_AUTH_SECRET \
            -e VINGA_API_SECRET \
            -e VINGA_DB_HOST -e VINGA_DB_PORT -e VINGA_DB_USER -e VINGA_DB_PASSWORD \
            -e VINGA_DB_NAME=vinga_slim_boot \
            -e ANTHROPIC_API_KEY=not-a-real-key \
            -e OPENAI_API_KEY=not-a-real-key \
            -v slim-boot-data:/data \
            -v "$PWD/tests/smoke/config.slim.yaml:/config/config.yaml:ro" \
            vinga-server:ci-amd64
          for _ in $(seq 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' slim-boot)
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          docker logs slim-boot
          docker rm -f slim-boot
          [ "$status" = "healthy" ] || { echo "::error::the slim image did not come up on an external-provider config"; exit 1; }

      # The other half, and the more important one: an image that
      # started and then broke on the first utterance would be far worse
      # than one that will not start. The message is asserted, not just
      # the exit code, so a refactor that turns this into a generic
      # crash is caught.
      - name: Check the slim image refuses local engines
        if: matrix.variant == 'slim'
        run: |
          docker run --rm --network "$SMOKE_NETWORK" \
            -e VINGA_AUTH_SECRET \
            -e VINGA_API_SECRET \
            -e VINGA_DB_HOST -e VINGA_DB_PORT -e VINGA_DB_USER -e VINGA_DB_PASSWORD \
            -e VINGA_DB_NAME=vinga_slim_refuse \
            -v slim-refuse-data:/data \
            -v "$PWD/tests/smoke:/smoke:ro" \
            -v "$PWD/tests/smoke/config.local-engines.yaml:/config/config.yaml:ro" \
            --entrypoint sh vinga-server:ci-amd64 /smoke/seed-local-engines.sh
          if docker run --rm --name slim-refuse \
              --network "$SMOKE_NETWORK" \
              -e VINGA_AUTH_SECRET \
              -e VINGA_API_SECRET \
              -e VINGA_DB_HOST -e VINGA_DB_PORT -e VINGA_DB_USER -e VINGA_DB_PASSWORD \
              -e VINGA_DB_NAME=vinga_slim_refuse \
              -v slim-refuse-data:/data \
              -v "$PWD/tests/smoke/config.local-engines.yaml:/config/config.yaml:ro" \
              vinga-server:ci-amd64 > refusal.log 2>&1; then
            echo "::error::the slim image started on a config naming a local engine"
            cat refusal.log
            exit 1
          fi
          cat refusal.log
          grep -q "needs the faster-whisper extra" refusal.log || {
            echo "::error::the refusal did not name the missing extra"
            exit 1
          }

      # The milestone acceptance, encoded: one seeded database, one
      # mounted YAML, one docker run, one whole conversation. The
      # seeding runs the CLI from the image being tested, against the
      # database the server then reads, which is the deployment
      # procedure rather than a fixture.
      #
      # The CLI writes through the configuration API, so the seeding
      # script starts a server of its own inside this container, waits
      # for /readyz, configures it over loopback and stops it again.
      # That is why this container is given what a server needs: the two
      # secrets, and nothing else, because an empty domain half builds no
      # provider and so needs no provider credential.
      - name: Seed the domain configuration
        run: |
          docker run --rm --network "$SMOKE_NETWORK" \
            -e VINGA_AUTH_SECRET \
            -e VINGA_API_SECRET \
            -e VINGA_DB_HOST -e VINGA_DB_PORT -e VINGA_DB_USER -e VINGA_DB_PASSWORD \
            -e VINGA_DB_NAME=vinga_smoke \
            -v smoke-data:/data \
            -v "$PWD/tests/smoke:/smoke:ro" \
            -v "$PWD/tests/smoke/config.yaml:/config/config.yaml:ro" \
            --entrypoint sh vinga-server:ci-amd64 /smoke/seed.sh

      - name: Start the container
        run: |
          docker run -d --name vinga-smoke \
            -p 8003:8003 \
            --network "$SMOKE_NETWORK" \
            -e VINGA_AUTH_SECRET \
            -e VINGA_API_SECRET \
            -e VINGA_DB_HOST -e VINGA_DB_PORT -e VINGA_DB_USER -e VINGA_DB_PASSWORD \
            -e VINGA_DB_NAME=vinga_smoke \
            -v smoke-data:/data \
            -v "$PWD/tests/smoke/config.yaml:/config/config.yaml:ro" \
            vinga-server:ci-amd64

      - name: Wait for the healthcheck
        run: |
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' vinga-smoke)
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "the container never became healthy"
          docker logs vinga-smoke
          exit 1

      - name: Smoke tests
        env:
          VINGA_SMOKE_OTA_URL: http://127.0.0.1:8003/xiaozhi/ota/
          # What the image above was built with, so the smoke lane can
          # check that a container can name its own build. Unset when
          # somebody runs this against a container they started by hand,
          # and the check skips rather than guesses.
          VINGA_SMOKE_REVISION: ${{ env.REVISION }}
        run: uv run pytest tests/smoke -v

      # `docker stop` is what sends SIGTERM and waits; -t is above
      # server.drain_s so the drain finishes rather than being killed
      # part-way through. `docker rm -f` would SIGKILL and exercise
      # nothing, which is what this step used to do.
      #
      # Deliberately not `if: always()` and deliberately not masked with
      # `|| true`: this asserts that the shutdown ran, and a cleanup
      # command that cannot fail cannot assert anything.
      - name: Stop the container and check it drained
        run: |
          docker stop -t 30 vinga-smoke
          if ! docker logs vinga-smoke 2>&1 | grep -q "shutting down: draining conversations"; then
            echo "::error::SIGTERM did not reach the server: no drain ran before exit"
            docker logs vinga-smoke
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs vinga-smoke || true

      - name: Remove the container
        if: always()
        run: docker rm -f vinga-smoke || true

      # And the database the three scenarios shared, with the network it
      # was on. `always()` because a job that failed part way still has
      # a container and a network holding a port and a name, and the
      # next run on the same runner would collide with them.
      - name: Remove the database and its network
        if: always()
        run: |
          docker logs "$VINGA_DB_HOST" 2>&1 | tail -50 || true
          docker rm -f "$VINGA_DB_HOST" || true
          docker network rm "$SMOKE_NETWORK" || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deliberately not gated on main, unlike the login and the publish
      # below. Computing tags is free, and gating it meant the one step
      # that decides what a variant is called was never exercised until
      # after a merge, which is the worst place to find out an
      # expression was wrong. A dispatch run prints exactly what a
      # push to main would publish.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Build times rather than versions, like the changelog's dates:
          # there is no semver yet, and a timestamp plus a SHA says
          # everything a rollback needs. To the minute (UTC), not the
          # day: several merges land on a good day, and a tag a later
          # build can claim is a moving pointer wearing a release's
          # clothes. The moving tag is the only one here that moves:
          # `latest` for the default variant, `slim` for the slim one.
          tags: |
            type=raw,value=${{ matrix.moving }}
            type=raw,value={{date 'YYYY-MM-DD-HHmm'}}${{ matrix.suffix }}
            type=sha,format=short,suffix=${{ matrix.suffix }}

      # The agreement this is all for, checked rather than assumed:
      # `type=sha,format=short` decides the tag's length, and if it ever
      # stopped being the seven characters computed above, a container
      # would go back to reporting something its tag does not say, which
      # is the defect and not a detail. Runs whenever the tags are
      # computed, so a dispatch run catches a change in either before
      # a merge does.
      - name: Check the sha tag carries the revision
        run: |
          tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep ':sha-' || true)
          if [ -z "$tag" ]; then
            echo "no sha- tag was computed"
            exit 1
          fi
          echo "tag: $tag"
          echo "revision: $REVISION"
          case "$tag" in
            *":sha-${REVISION}${{ matrix.suffix }}") ;;
            *)
              echo "the sha- tag does not end in the revision this build reports"
              exit 1
              ;;
          esac

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: vinga-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What makes a running container able to name its own build.
          # The same seven characters the `sha-` tag carries, so
          # /healthz and the image tag are equal rather than one being
          # a prefix of the other.
          build-args: |
            VINGA_REVISION=${{ env.REVISION }}
            VINGA_VARIANT=${{ matrix.variant }}
          # Scoped per variant. The two carry different dependency
          # layers, and an unscoped gha cache is one namespace, so
          # without this they overwrite each other's manifests every
          # run and each variant pays for the other's churn. Not a
          # correctness risk (BuildKit cache is content addressed), a
          # hit-rate one.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
