# vinga-server deployment example: the container image behind a
# TLS-terminating proxy, on a small CPU quota. Where config.example.yaml
# is the reference that documents every server-half key, this file sets
# only what a deployment should decide, with values validated by latency
# measurements from a live deployment. Take it as the starting point
# and adapt it.
#
# The file is the server half. The domain half of this same profile
# (the providers it runs on, its agent and its device binding) is
# written into the database with `vinga-server config`, by the runnable
# script beside it, config.deploy.example.sh, which carries the same
# measured values and the reasoning behind each one.
#
# The published image already reads a config mounted at
# /config/config.yaml (mounting one is optional; without it the server
# half comes from the defaults and VINGA_SERVER__* alone), sends every
# model cache to the /data volume (HOME=/data), and defaults its logs to
# the json format, so none of that appears here.
#
# Which database it serves is not in this file either, and deliberately:
# it is the VINGA_DB_HOST, VINGA_DB_PORT, VINGA_DB_NAME, VINGA_DB_USER
# and VINGA_DB_PASSWORD variables the deployment sets, beside the other
# credentials. A server that cannot reach the database it was pointed at
# refuses to start with a sentence naming those variables.
#
# Secrets never live in this file: the keys below name environment
# variables, and the deployment provides them.
#
# This profile assumes the DEFAULT image variant, the unsuffixed tags:
# it configures faster_whisper for ASR and piper for TTS, and the slim
# variant carries neither and would refuse to start on it. A deployment
# whose ASR and TTS both name external providers can use the slim
# variant instead and save about 390 MB.

server:
  host: 0.0.0.0
  port: 8003

  # The websocket URL the OTA endpoint hands to devices, set explicitly
  # because TLS ends at the proxy: the server itself only ever sees
  # plain HTTP, so a URL derived from the request would say ws:// and
  # devices would fail to connect with nothing obviously misconfigured.
  websocket_url: wss://voice.example.com/xiaozhi/v1/

  # The origin devices reach this deployment on, set for the same reason
  # the websocket URL is: TLS ends at the proxy, so nothing the server
  # sees about a request says what a person should type. This is the
  # origin the onboarding URL is printed with, at startup and on a GET
  # of the OTA endpoint.
  public_url: https://voice.example.com

  # How a board is onboarded: the short path /x/<key>/, which serves the
  # same OTA endpoint as ota_path below. This is the string a person
  # types into a board's captive portal, so it is eight characters in an
  # alphabet with no 0/O and no 1/I/l to misread off a small display.
  #
  # The key is derived from VINGA_AUTH_SECRET, the secret this
  # deployment already has: nothing here holds it, nothing stores it, it
  # survives restarts, and it changes only when that secret does. So
  # there is no segment to inject from a secret store and none to keep
  # out of version control. Print it with
  #
  #   vinga-server config ota-url
  #
  # which reads this file and contacts nothing, and the server prints
  # the same URL at startup.
  onboarding:
    enabled: true
    # Pin the key only across a rotation of VINGA_AUTH_SECRET, to keep
    # a board being onboarded through a URL written down before the
    # rotation reaching this server. A pinned key stands in front of the
    # endpoint that issues device tokens, so inject it from the secret
    # store rather than committing it with this file.
    #
    #   VINGA_SERVER__ONBOARDING__KEY=<the previous key>
    # key: AB2C4D5E

  # The legacy full OTA path, for boards already carrying one in NVS.
  # The endpoint issues the device tokens, so it cannot itself require
  # one; exposed publicly it hides behind a random path segment
  # (openssl rand -hex 16). That segment is a credential: the same full
  # URL sits in each device's NVS ota_url, and rewriting NVS wipes a
  # board's wifi provisioning, so it is chosen once and never rotates.
  # When the adapted file is version-controlled, as a container
  # deployment's usually is, do not write it here: inject the whole path
  # from the secret store, relying on environment overrides beating the
  # file.
  #
  #   VINGA_SERVER__OTA_PATH=/xiaozhi/ota/<random-segment>/
  #
  # A deployment whose boards were all onboarded through the short path
  # above needs none of that: leave this null, which unmounts the route
  # and leaves one way in. The websocket path never moves: the token is
  # what protects it.
  # ota_path: /xiaozhi/ota/replace-with-a-random-segment/

  # On by default, and the server refuses to boot without the secret in
  # the environment. Listed so the deployment remembers to provide it:
  #
  #   VINGA_AUTH_SECRET=$(openssl rand -hex 32)
  auth:
    enabled: true
    secret_env: VINGA_AUTH_SECRET

  # What one server holds at once. The cap is per container and
  # defaults to 8; size it to the actual device fleet. A device
  # refused for capacity reconnects on its next wake word.
  # limits:
  #   max_sessions: 8

  # Barge-in gating for a noisy deployment, defaults shown. Speech
  # shorter than the floor never interrupts a reply, nothing does
  # inside the refractory window after playback starts, and past both
  # the reply is paused and cancelled only when ASR transcribes actual
  # words. When room noise or playback bleed still cuts replies short,
  # raise the floor first. The companion knob is the threshold on the
  # silero provider entry (written by config.deploy.example.sh):
  # raising it makes the endpointer stricter about what counts as speech
  # in the first place, so less noise ever reaches these gates.
  # barge_in_min_speech_ms: 500
  # barge_in_refractory_ms: 1000

  # How long the LLM may take to its first token before the round is
  # cancelled and retried once; a second timeout ends the round as a
  # silent turn instead of a session stuck in replying. Only the wait
  # for the first token is bounded; a long reply already streaming is
  # healthy. The default clears every healthy round measured in the
  # field (first tokens cluster at 500 to 800 ms, worst spike 8.9 s)
  # and cuts the 17 s stalls this exists for. The reasoning behind the
  # number is in config.example.yaml.
  # llm_first_token_timeout_s: 10

  # Minutes east of UTC, for devices that should show local time. A
  # fixed offset, not a zone: it goes stale at every DST change.
  # Unset, the server's own current offset applies.
  # timezone_offset_minutes: 120

  # Recording what was said into the `record` schema of the same
  # database the configuration lives in. Absent, as here, means no
  # writer is started and no row is ever written. Turn it on
  # deliberately: it keeps conversation text, and the two switches under
  # the flag are the only privacy controls this release has, so they are
  # deployment-wide. Retention is 90 days unless this says otherwise, and
  # 0 keeps everything forever. The reasoning behind each key is in
  # config.example.yaml, and the columns are in
  # docs/reference/conversations-schema.md.
  # conversations:
  #   enabled: true
  #   metrics: true
  #   text: true
  #   retention_days: 90
  #   # Finding a past conversation by description and carrying on with
  #   # it. Needs the two switches above, and is refused at boot without
  #   # them.
  #   resumption: false
  #   resumption_budget_tokens: 6000

  # How long a shutdown waits for conversations in flight to finish
  # speaking. Set the orchestrator's grace period between SIGTERM and
  # SIGKILL to at least twice this, so a drain still in progress is
  # never killed; `docker stop` defaults to ten seconds, below even
  # the drain itself, so it needs its own -t raised.
  drain_s: 20

# Facts agents remember between conversations. Removing this section
# removes the remember tool with it. The directory sits on the data
# volume, the one place a container running a read-only root
# filesystem can write.
memory:
  dir: /data/memory

# The domain half of this profile lives in the database, not in this
# file: the providers it runs on, its agent and its device binding are
# written with `vinga-server config`, and the document that carries them
# is the runnable script beside this one, config.deploy.example.sh, with
# the same measured values and the reasoning behind each. It is one
# `config apply` against the running server, so run it once the server
# is up, from inside the container or with VINGA_API_URL naming the API.
#
# There is deliberately no default agent in it: leaving it unset is what
# turns the device bindings into an allowlist, so an unknown device
# resolves to no agent, is issued no token, and is refused at the
# handshake. With the OTA endpoint guarded only by its unguessable path,
# a publicly exposed deployment wants that refusal.
