# A whole deployment on vendor APIs: a cloud model, cloud
# transcription, a cloud voice, and the one stage that is local
# whatever else is, because the endpointer runs on every audio frame
# before anything leaves the host. One document, written in one
# transaction and then installed on the running server:
#
#   vinga import -f examples/presets/cloud-stack.yaml
#   vinga apply
#
# The import orders the writes for you. A write whose references do not
# resolve is refused, and a document is refused whole rather than half
# written, so there is no creation order to get right here: the
# providers, the defaults naming them and the agent inheriting them all
# arrive together. Importing is additive and never deletes, so a section
# this document does not name is left alone and the same document twice
# changes nothing. Nothing the import wrote is serving until the apply
# behind it installs it.
#
# No credential is written here, and none can be. Every key below names
# the environment variable that holds the value, and the models refuse
# anything else. Two variables run this deployment,
# `ANTHROPIC_API_KEY` and `OPENAI_API_KEY`, and the server reads them
# at startup. The other way to hold a credential is encrypted in the
# database, which never puts it in a file at all:
#
#   vinga provider secret set llm brain api_key
#
# A stored secret wins over an environment reference for the same slot,
# and `vinga show` marks the reference it displaces.
#
# There are deliberately no devices and no default agent below. Which
# board talks to which agent is the one thing a preset cannot know, and
# it is one command afterwards. Bind one board, by the MAC on its
# sticker:
#
#   vinga device bind aa:bb:cc:dd:ee:ff assistant
#
# or point every board that is bound to nothing at one agent:
#
#   vinga default-agent set assistant
#
# Every field below is documented in docs/reference/domain-config.md,
# and examples/ holds a commented fragment per provider type with the
# measured numbers behind each default.

providers:
  llm:
    brain:
      type: anthropic
      model: claude-sonnet-5
      api_key_env: ANTHROPIC_API_KEY

  asr:
    # The one cloud stage usually faster than its local alternative: the
    # work runs on someone else's accelerator, so the round trip is
    # cheaper than a CPU decode, and it hears non-English far better
    # under noise.
    ears:
      type: openai
      api_key_env: OPENAI_API_KEY
      # Set this for any deployment that is not English. Far-field mic
      # audio through Opus gives detection very little to go on, and an
      # unpinned language comes back as nonsense shaped like English.
      language: en

  tts:
    # The same key serves this stage and the model, which is the reason
    # to reach for it. examples/tts-elevenlabs.yaml is the alternative
    # and sounds better; it needs a voice from your own library and a
    # third variable.
    voice:
      type: openai
      voice: alloy
      api_key_env: OPENAI_API_KEY

  vad:
    # Local, and a core dependency rather than an extra: it decides
    # where an utterance starts and ends before any audio is sent
    # anywhere.
    gate:
      type: silero

# What every agent uses unless it names something else. A prompt is
# deliberately not here: a prompt is what makes an agent that agent.
agent_defaults:
  llm: brain
  asr: ears
  tts: voice
  vad: gate

agents:
  assistant:
    # State the reply language explicitly: models otherwise pick one by
    # their training bias.
    prompt: >
      You are a helpful voice assistant. Keep replies short, plain, and
      speakable: one or two sentences, no lists, no markdown. Always
      reply in the language the user spoke.
