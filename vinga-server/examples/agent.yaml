# One agent: a prompt combined with one provider per stage,
# and every stage must resolve to a provider (here or in agent_defaults)
# for the server to start, so a typical agent is a prompt and a voice.
#
#   vinga agent set assistant -f examples/agent.yaml
#
# The same file installed under a second name is a second agent; edit
# the prompt and the voice and nothing else has to move.

# State the reply language explicitly: models otherwise pick one by
# their training bias (the reference server's default is Chinese).
prompt: >
  You are a helpful voice assistant. Keep replies short, plain, and
  speakable: one or two sentences, no lists, no markdown. Always reply
  in the language the user spoke.

# Overriding one stage: everything unnamed here is inherited from
# agent_defaults, so this agent runs on the default model and the
# default recognizer with a voice of its own.
tts: eleven

# The model overrides the same way: naming an llm entry runs this agent
# on that provider instead of the default, which is how one agent runs
# on the local model while its siblings stay on the cloud one.
# llm: local

# Naming a list replaces the inherited one rather than extending it,
# like the stage fields above. An empty list (`mcp: []`) is how an agent
# opts out of tools its siblings have.
#
# An entry is either the server's name on its own, which is all of its
# tools, or the object form below: the server, and which of its tools
# this agent may reach. The tools are named the way the model is given
# them minus the entry prefix, which is the name `vinga-server config
# status` prints under `tools:` (`turn_on_light` for
# `home__turn_on_light`); leaving `tools` out of the object means the
# whole server, and there is no deny list, because a denied set would
# silently grant whatever the server adds next.
mcp:
  - weather
  - server: home
    tools:
      - turn_on_light
      - turn_off_light

# The shared prompt fragments this agent's system prompt carries, named
# the way agent_defaults names them and following the same rule as the
# lists above: naming a list replaces the inherited one rather than
# extending it, and `prompt_includes: []` opts this agent out of the
# fragments its siblings share. Leaving the key out inherits the
# agent_defaults list, which is what most agents want.
#
# The blocks are injected after this agent's prompt, in the order listed
# here, exactly as they were written. `vinga agent preview
# <name>` prints what they add up to.
prompt_includes:
  - household

# An agent may name its own filler section, which replaces the inherited
# one wholly rather than merging with it. See examples/agent-defaults.yaml
# for what the section holds.
# filler:
#   enabled: false

# What this agent says when a reply fails outright, which it does unless
# this says otherwise. An agent may name its own fallback section, which
# replaces the inherited one wholly rather than merging with it; see
# examples/agent-defaults.yaml for what the section holds. Off leaves
# this agent's failed turns silent, which is what they were before the
# phrase existed.
# fallback:
#   enabled: false

# Whether this agent remembers anything, which it does unless this says
# otherwise. Off is the whole family at once: no memory tools are
# offered and no remembered facts, no notes about the board and no
# conversation state are injected into the prompt, so the agent can
# neither write memory nor read it, including what its siblings on the
# same board were told. Nothing already stored is deleted, and switching
# it back on is an agent that remembers what it remembered before.
# memory:
#   enabled: false
