# An MCP server reached over HTTP rather than spawned. The transport is
# what decides which fields apply, and naming one of the other
# transport's fields (a `command` here) is an error rather than a
# silently ignored key.
#
#   vinga mcp-server set weather -f examples/mcp-server-streamable-http.yaml
#
# The entry name is what its tools are prefixed with in the merged tool
# list (`weather__forecast`), so it must be a plain [A-Za-z0-9_-]+ name
# and cannot be `self` or a builtin's name (`switch_agent`, `remember`).
#
# This is the only HTTP transport there is. An endpoint that speaks the
# deprecated SSE transport instead is configured as a stdio server
# behind an mcp-proxy bridge; examples/mcp-server-stdio.yaml is that.

transport: streamable_http

url: http://localhost:8000/mcp

# A value of $NAME is read from that environment variable at startup,
# and any secret-bearing key must use that form. The encrypted
# alternative addresses the same slot by its dotted path:
#
#   vinga mcp-server secret set weather headers.Authorization
#
headers:
  Authorization: $WEATHER_TOKEN

# Tool arguments carry conversation-derived data, and no transport can
# know where they end up: a url may name localhost and it may name a
# vendor. Under server.local_only every referenced entry must therefore
# declare its egress; false is the operator asserting that whatever the
# URL reaches stays on your own network, as this local endpoint does.
egress: false

# How long one call may take before the model is told it timed out. The
# device hears silence meanwhile, so keep it short.
# tool_timeout_s: 15

# What the model should know about using this server's tools, injected
# into the system prompt of every agent this entry is granted to. It is
# stored and injected as written, so its indentation and its own blank
# lines are part of it.
instructions: |
  Forecasts from this server are for the user's own town unless they
  name another one. Give temperatures in Celsius and round them to whole
  degrees: this is spoken out loud.

# A server can also ship guidance about itself, through two channels of
# its own: the `instructions` of its handshake, and the prompts it
# publishes. That text is the third party steering your agent rather
# than you steering it, so nothing of it is injected until this entry
# says so, channel by channel. Read what the server ships before you
# turn either of these on, and remember that what it ships can change
# under you: it is re-read on every connect.
#
# Whatever comes in this way is capped at 4000 characters per block,
# skipped whole rather than truncated if it is longer, and reported by
# `vinga agent preview <agent>` under its own provenance, so you
# can see whose words are in the prompt and what they cost.

# The handshake channel. Turning this on applies at the next apply
# without dropping the connection, since what the server shipped was
# captured when it connected.
use_server_instructions: true

# The prompts channel, opted into one prompt at a time and by the name
# the server lists it under: the specification calls prompts
# user-controlled templates and a server may publish dozens, so name the
# ones that are standing guidance. They are injected in this order,
# after everything above. Editing this list changes what a connect
# fetches, so an apply restarts the connection to install it.
#
# A name this server does not list, a prompt that needs arguments, and
# one that renders anything but text are each skipped with a warning
# naming this entry and the position in this list.
inject_prompts:
  - forecast_style
