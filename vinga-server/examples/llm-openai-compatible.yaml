# The LLM stage on any endpoint that speaks the OpenAI chat completions
# API: a local runner (Ollama, llama.cpp, vLLM) or a hosted gateway.
#
#   vinga-server config set provider llm local -f examples/llm-openai-compatible.yaml

type: openai_compatible

base_url: http://localhost:11434/v1

model: qwen3:8b

# Any other key is sent to the endpoint as part of the request, and this
# is the one provider type that works that way. It is what the type is
# for: every server speaking this dialect takes parameters no other one
# does, so an option vinga has never heard of travels rather than being
# refused. The exceptions are the fields vinga composes for every
# request, which it refuses here because writing one of them would
# rewrite the request rather than configure the server: model,
# max_tokens, messages, stream, stream_options, tools and tool_choice.
# top_p: 0.9

# Whether an openai_compatible endpoint sends session data off the host
# is decided by base_url, so the server cannot know it from the type.
# Under server.local_only the entry must say: egress: false is the
# operator asserting the endpoint stays on this machine. Types that know
# their own egress (anthropic, silero, faster_whisper, piper) reject the
# key.
egress: false

# An endpoint that authenticates names the variable holding its key
# here. A keyless local runner leaves it out.
# api_key_env: LOCAL_LLM_API_KEY
