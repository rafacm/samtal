# Cloud synthesis, streamed. Costs a network round trip per sentence
# and sends the reply text to the vendor, and sounds markedly better
# than a local voice for it.
#
#   vinga provider set tts eleven -f examples/tts-elevenlabs.yaml
#
# Every option below is passed to the ElevenLabs streaming endpoint,
# whose reference documents all of them:
# https://elevenlabs.io/docs/api-reference/text-to-speech/stream

type: elevenlabs

# Voice id from your ElevenLabs voice library: the id, not the display
# name, and account-specific even for the stock voices. Browse and pick
# one in the ElevenLabs app, or list yours with:
#
#   curl -s -H "xi-api-key: $ELEVENLABS_API_KEY" \
#     https://api.elevenlabs.io/v1/voices \
#     | jq -r '.voices[] | "\(.voice_id)  \(.name)"'
#
# The current listing endpoint, with search and filtering:
# https://elevenlabs.io/docs/api-reference/voices/search
#
# Two things the voice listing does not tell you, both found by a
# deployment that hit them.
#
# The stock voices are recorded by English speakers. The model is
# multilingual and any voice will speak any of its languages
# intelligibly, which reads as "any voice works for any language", but a
# stock voice speaking Spanish sounds like an American speaking fluent
# Spanish. Pin a native voice for any non-English agent; a professional
# clone in the target language is what fixes it.
#
# A professional clone is fine-tuned per model, and one that is not
# available on the model below fails at synthesis rather than at boot.
# On a deployment where nobody is watching the logs that presents as
# silence on the device, so validate a clone's ID with one throwaway
# synthesis call before shipping it.
voice_id: PUT_YOUR_VOICE_ID_HERE

api_key_env: ELEVENLABS_API_KEY

# Default: eleven_flash_v2_5, the low-latency model (~75 ms to first
# byte, 32 languages). eleven_multilingual_v2 sounds better and answers
# slower, which a conversation feels. The model list, with each one's
# languages and latency:
# https://elevenlabs.io/docs/overview/models
# model: eleven_multilingual_v2

# Audio asked of the API. Only the pcm_<rate> formats work here, since
# the stage streams raw PCM; the default matches the rate devices are
# spoken at, so nothing is resampled. pcm_44100 and up need a paid
# ElevenLabs tier.
# output_format: pcm_24000

# Pin the spoken language (ISO 639-1) instead of letting the model infer
# it from the text.
# language_code: sv

# Passed to the API as given. Higher stability is more monotone and more
# predictable; speed is a multiplier around 1.0, capped at 0.7 to 1.2.
# The other keys are style and use_speaker_boost, which costs latency.
# What each one does to a voice:
# https://elevenlabs.io/docs/overview/capabilities/text-to-speech/best-practices
# voice_settings:
#   stability: 0.5
#   similarity_boost: 0.75
#   speed: 1.0

# Seconds before a synthesis request is abandoned.
# timeout_s: 30
