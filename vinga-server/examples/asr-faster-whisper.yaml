# Local transcription with faster-whisper, on the CPU.
#
#   vinga provider set asr whisper -f examples/asr-faster-whisper.yaml
#
# The audio never leaves the host, which this type knows about itself:
# it is what server.local_only accepts without an assertion, and it
# rejects an `egress` key. It needs the faster-whisper extra
# (`uv sync --extra faster-whisper`), which the default container image
# carries and the slim one does not.

type: faster_whisper

# Whisper model size (tiny/base/small/medium/large-v3 or a Hugging Face
# model id); weights download at server startup.
model: small

# Language hint (ISO 639-1, e.g. sv or en); omit to auto-detect per
# utterance. Detection costs a constant encoder pass per utterance,
# several seconds of it on a small CPU.
# language: sv

# device: cpu
# compute_type: int8

# Greedy decoding by default: beam search costs a multiple of the CPU
# time and buys little accuracy on short spoken commands.
# beam_size: 1

# Threads for CPU inference. The engine sizes its pool from the host's
# core count and ignores container CPU quotas, so inside a limit set
# this to the quota (0 keeps the engine default).
# cpu_threads: 3

# Strip non-speech inside the ASR call before decoding. Cuts both
# latency and hallucinations on silence-padded utterances; recommended
# on. vad_parameters tunes the engine's own VAD.
# vad_filter: true
# vad_parameters:
#   min_silence_duration_ms: 500

# Feeding each window's text into the next is the documented cause of
# repetition loops; false is the standard mitigation.
# condition_on_previous_text: false

# Fallback ladder for failed decodes. The engine's six-step default can
# retry one bad utterance six times over; a short ladder bounds
# worst-case latency, which a voice UI feels.
# temperature: [0.0, 0.2]

# Detection scope. every_utterance (the default) detects fresh on each
# turn; once detects until a confident answer arrives, then reuses that
# language for the rest of the session, so later turns skip the whole
# detection pass. A speaker rarely switches language mid-conversation; a
# new conversation detects afresh.
# language_detect: once

# Below this detection confidence, distrust the guess: use
# language_fallback instead when one is set, and never lock a session to
# it. Misdetections cluster at low confidence, and a wrong language
# costs extra decode time on top of being wrong.
# language_confidence_floor: 0.6
# language_fallback: en
