# An MCP server this server spawns and talks to over stdio. This one
# proxies to a Home Assistant on the LAN.
#
#   vinga mcp-server set home -f examples/mcp-server-stdio.yaml
#
# The entry name is what its tools are prefixed with in the merged tool
# list (`home__turn_on_light`), which is why it must be a plain
# [A-Za-z0-9_-]+ name and cannot be `self` or a builtin's name
# (`switch_agent`, `remember`): those already mean something there.
#
# A server that is down at startup only logs a warning; its tools are
# absent and the server reconnects in the background when a session
# needs it.

transport: stdio

# mcp-proxy here is also the bridge for an SSE-only server: SSE is
# deprecated in the specification and has no transport of its own here,
# so an SSE endpoint is proxied over stdio, as this one is.
command: mcp-proxy

args:
  - http://homeassistant.local:8123/mcp_server/sse

# Secrets are never written here: a value of $NAME is read from that
# environment variable at startup, and any key that looks secret-bearing
# (token, api_key, authorization, ...) must use that form. The other way
# is to store the value encrypted in the database, under the slot the
# key names:
#
#   vinga mcp-server secret set home env.API_ACCESS_TOKEN
#
env:
  API_ACCESS_TOKEN: $HOME_ASSISTANT_TOKEN

# Tool arguments carry conversation-derived data, and no transport can
# know where they end up: a stdio command may proxy anywhere, a url may
# name localhost. Under server.local_only every referenced entry must
# therefore declare its egress; false is the operator asserting that
# whatever the command or URL reaches stays on your own network, as this
# proxy to a Home Assistant on the LAN does.
egress: false

# How long one call may take before the model is told it timed out. The
# device hears silence meanwhile, so keep it short.
# tool_timeout_s: 15

# What the model should know about using this server's tools, injected
# into the system prompt of every agent this entry is granted to, under
# a heading naming the prefix its tools carry. Written for the whole
# entry rather than for one tool, so write about the surface the agents
# are actually granted: guidance about a tool an allow list withholds is
# noise in every prompt that carries it.
#
# It applies at the next activation of a conversation (a new session, or
# an agent switch) once the running server has been asked to apply, and
# editing it does not restart the connection.
instructions: |
  The lights, the blinds and the front door are on this server. Turn
  lights on and off freely. Always ask the user to confirm before
  unlocking the door, and say which door you are about to unlock.
