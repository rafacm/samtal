[project]
name = "vinga-server"
version = "0.1.0"
description = "Vinga conversation server: OTA endpoint, device websocket protocol, and the VAD/ASR/LLM/TTS pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
# The client half, which is what the default install is.
#
# `vinga` is a configuration client: it reads YAML, validates it against
# the models, renders it, and sends it to the configuration API. Nothing
# it does needs a database, an encryption key, a web framework or a
# model. So the default install is exactly what that takes, and a
# workstation administering a deployment it does not host gets it with
# `uvx --from git+...` and pulls no server at all.
#
# The server half is the `serve` extra below. It is an image-build and
# contributor mechanism and never an operator-facing concept: a
# deployment runs the published image and installs nothing.
dependencies = [
    # Direct because the CLI speaks the configuration API over it. It
    # also arrives with the cloud providers' SDKs, which name their
    # APIs rather than pulling in a vendor client.
    "httpx>=0.28",
    "pydantic>=2.9",
    # The models import it eagerly: the file half is a settings model
    # and the CLI imports the models, so this is the client's as much
    # as the server's.
    "pydantic-settings>=2.6",
    # The .env file both entry points read before anything looks at the
    # environment.
    "python-dotenv>=1.0",
    # Fragments, documents and everything this grammar prints.
    "pyyaml>=6.0",
    # The argument layer of the configuration grammar. Click arrived
    # transitively already (uvicorn); this is direct because the grammar
    # is built on it, and it is a runtime dependency rather than a
    # development one because the command group ships. It is in the
    # client tier because the grammar IS the client.
    "typer>=0.27.1",
]

[project.optional-dependencies]
# The server half: everything a conversation, a database or an HTTP
# server needs, and nothing the CLI reaches.
#
# Two doors install it and neither belongs to an operator. The image
# build names it in the Dockerfile, which is where the name stays; a
# contributor gets it through the `dev` group below, so `uv sync` keeps
# yielding a runnable server with no new flags. Nobody installs the
# server as a Python package on a host: that is #223's ruling, and it is
# why nothing in the READMEs, in `cli.md` or in the changelog tells an
# operator to install anything at all.
serve = [
    # The migrations, run on every database open.
    "alembic>=1.18.5",
    "anthropic>=0.120.0",
    # The Opus codec on the device socket.
    "av>=18.0.0",
    # Fernet, for the domain configuration's secrets at rest.
    "cryptography>=49.0.0",
    "fastapi>=0.115",
    # 1.24 is the first release carrying streamable_http_client, the
    # replacement for the deprecated wrapper the transport used to call.
    # Capped below 2 because MCP 2 needs httpx 2 and yields a transport
    # this client does not unpack; migrating to it is its own change.
    "mcp>=1.24,<2",
    "openai>=2.48.0",
    # The VAD, which runs on every audio frame whichever ASR is
    # configured. A core dependency of serving rather than an extra of
    # it, which is why both image variants carry it.
    "pysilero-vad>=3.4",
    # The Postgres driver, as the pure-Python distribution. The binary
    # implementation is a door rather than a default: `psycopg[binary]`
    # here would make every install of this extra pull a wheel with a
    # libpq inside it, including the source-backed install a custom
    # image build may want. The dev group and the Dockerfile name the
    # binary one explicitly; what a bare `[serve]` install needs beside
    # this is a libpq on the system.
    "psycopg>=3.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.34",
]
# What `vinga simulator run` needs, and nothing else.
#
# A third tier rather than a line in the client half, because holding a
# conversation is not what a configuration client does: the default
# install administers a deployment and needs no websocket for any of it.
# It is also not the server half, and putting it there would make trying
# vinga without hardware mean installing a server.
#
# One distribution, chosen for being the smallest new root this protocol
# can be spoken over: `websockets` has an empty dependency closure, ships
# a pure-Python wheel, and is already in `uv.lock` because
# `uvicorn[standard]` reaches it, so the tiering costs no new resolution.
# The alternatives, in the order they were checked: `aiohttp`, a whole
# HTTP stack for one upgrade; `httpx-ws`, a second httpx-shaped
# dependency plus wsproto; and hand-rolling RFC 6455, which is a masking
# and fragmentation implementation nobody asked for in a repository whose
# posture is that the wire has one home.
sim = ["websockets>=16.1"]
# Local ASR (MIT). Model weights download from Hugging Face at startup.
faster-whisper = ["faster-whisper>=1.2"]
# Local TTS. piper-tts is GPL-3.0, which is why it is an optional extra
# and must never become a core dependency.
piper = ["piper-tts>=1.6"]

[project.scripts]
vinga-server = "vinga_server.main:main"
# The CLI as a tool of its own, which is the same entry function the
# `config` dispatch word reaches. It drops that word because there is
# nothing here to dispatch away from: both spellings resolve and
# everything after the word is identical, which is what makes the two
# one grammar rather than two.
vinga = "vinga_server.config.cli:main"

[dependency-groups]
# What a checkout gets. `uv sync` installs the default groups and the
# project, but not its extras, so both shipped extras are named here:
# that is the whole of what keeps the contributor door one command and
# keeps AGENTS.md's Commands section true without an edit.
#
# This is the one place a mistake is invisible to every other lane,
# because every other lane names its tier explicitly. The sync-then-run
# smoke in `tests/integration/test_tier_closure.py` is its guard, and it
# is named as such.
dev = [
    "vinga-server[serve,sim]",
    "httpx2>=2.9.1",
    # PEP 508 marker evaluation, for the tier lane's closure: it walks
    # `uv.lock` and has to decide which dependencies this platform
    # actually takes. It arrived transitively through pytest already;
    # direct because a test imports it, and an undeclared import is a
    # break waiting for the day the transitive edge goes.
    "packaging>=24",
    # The driver's binary implementation, so a checkout needs no libpq
    # of its own: `uv sync` and the compose instance are the whole of
    # the local loop. The `serve` extra deliberately carries the plain
    # distribution instead.
    "psycopg[binary]>=3.2",
    # Validates the committed OpenAPI document (Apache-2.0), so that
    # "the API generates a document" means one a client generator will
    # accept rather than one that happens to be JSON. Tests only: the
    # server never validates its own document at runtime.
    "mypy>=2.3.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9",
    "xiaozhi-sdk>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vinga_server"]

# The example fragments and the presets, carried inside the package as
# well as beside it.
#
# They are documentation an operator copies from, and they are also
# input: `config cli-reference` reads the command each of them quotes
# and publishes those lines as the recipes on the committed CLI
# reference. A command that shipped and then could not run is worse than
# one that does not ship, so what the command reads has to be in the
# artifact.
#
# Copied at build time from the one directory anybody edits rather than
# kept in two places: `vinga-server/examples/` stays where every
# documented `-f examples/...` and every documentation link already
# points, and the packaged copy is derived from it the way the wheel is
# derived from `src/`. CI renders the reference from the built wheel and
# diffs it against the committed page, which is what says the copy
# arrived.
#
# The packaged utterance needs no entry here and the absence is worth a
# line, because it is the same requirement answered by a different fact.
# `vinga simulator run` sends one sentence of Opus encoded at build time,
# and a command that shipped with nothing to say would be the audio half
# of the same failure; but that asset lives at
# `src/vinga_server/simulator/data/`, INSIDE the package above, so
# `packages` already carries it and a force-include of it is refused as a
# second file at one path. What says it arrived is the lane rather than
# the declaration: the wheel lane reads the built archive for it, and the
# `[sim]` environment runs the command that reads it.
[tool.hatch.build.targets.wheel.force-include]
"examples" = "vinga_server/examples"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

# The conversations baseline reproduces every column comment from
# `conversations/schema.py`, verbatim, because the comments are what
# `\d+` shows an analyst reading the store through psql and what the
# generated reference is rendered from. Reflowing them here would make
# the migration and the metadata two copies of one paragraph that could
# come to differ, which is exactly what a baseline reproduced from
# autogenerate exists not to be. The line limit is waived for that one
# file rather than for migrations generally.
[tool.ruff.lint.per-file-ignores]
"src/vinga_server/conversations/migrations/versions/1002_conversation_threads.py" = ["E501"]

# Static typing, scoped to the typed event package and nothing else.
#
# The repository has never run a type checker, and the typed event
# catalog is the first code whose whole argument is that its annotations
# carry the contract: a variant's fields ARE the payload, and a value
# type is what proves a value. Annotations that nothing checks would
# make that argument decoration. So this lane is strict, and it is
# narrow on purpose: widening it to the rest of the server is a decision
# of its own, with its own diff, and bundling it here would bury the
# thing being proved under a few hundred incidental findings.
#
# `follow_imports = silent` types what the package imports without
# reporting on it, which is what keeps the boundary at the package
# rather than at the import graph.
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/vinga_server/events"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suites name their files for what they test at their own level, so
# `test_ws_auth.py` and `test_drain.py` exist under both tests/unit and
# tests/integration. pytest's default import mode registers a test
# module by its bare basename, which makes that pair a collision and
# breaks any run that collects both suites, `uv run pytest` included.
# importlib mode imports each file by its full path instead, so the
# names can stay descriptive and CI does not have to keep the suites in
# separate commands to avoid it.
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # opuslib, the codec inside the xiaozhi-sdk test simulator (the server
    # itself uses PyAV), compiles with an `is not 0` identity comparison.
    # Unmaintained upstream, so the warning is not going away.
    "ignore:\"is not\" with 'int' literal:SyntaxWarning",
]
